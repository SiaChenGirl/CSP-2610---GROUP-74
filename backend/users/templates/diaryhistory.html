<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Diary History</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    {% load static %}
    <style>
        /* 1. LAYOUT & GRADIENT - Shared Team UI Style */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            display: flex;
            flex-direction: column;
        }

        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-area { text-align: center; }
        .title-area img { width: 253px; }
        .hamburger-menu { font-size: 24px; cursor: pointer; color: #6a4fbf; width: 180px; text-align: right; }
        
        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
        
        /* 2. DIARY DISPLAY BOX - Glassmorphism Card Style */
        .diary-card { 
            width: 500px; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            padding: 35px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(106, 79, 191, 0.12);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Header Controls */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(106, 79, 191, 0.15);
            padding-bottom: 15px;
        }

        .diary-date {
            font-size: 24px;
            font-weight: bold;
            color: #6a4fbf;
        }

        .entry-nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-arrow {
            font-size: 22px;
            cursor: pointer;
            color: #6a4fbf;
            user-select: none;
            transition: transform 0.2s, color 0.2s;
            background: none;
            border: none;
            outline: none;
            padding: 0 5px;
        }
        .nav-arrow:hover {
            color: #4a3494;
            transform: scale(1.2);
        }
        .nav-arrow:disabled {
            color: #c5b3e6;
            cursor: not-allowed;
            transform: none;
        }

        /* Mood Badges */
        .mood-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mood-emoji {
            font-size: 40px;
        }
        .mood-text {
            font-size: 18px;
            font-weight: 600;
            color: #4a3494;
        }

        /* Narrative Text Area */
        .diary-text {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            line-height: 1.6;
            color: #4a3494;
            margin: 5px 0;
            min-height: 80px;
            white-space: pre-line;
        }

        /* Embedded Photo Box */
        .diary-photo-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            max-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
        }
        .diary-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Music Player Widget */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e0d7ff;
            padding: 12px 20px;
            border-radius: 18px;
            margin-bottom: 5px;
        }
        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .music-icon {
            font-size: 24px;
        }
        .track-details {
            display: flex;
            flex-direction: column;
        }
        .now-playing {
            font-size: 11px;
            color: #8c7dbd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-name {
            font-size: 14px;
            font-weight: bold;
            color: #4a3494;
        }
        .player-controls {
            display: flex;
            gap: 15px;
            font-size: 16px;
            color: #6a4fbf;
            cursor: pointer;
        }
        .control-btn:hover {
            color: #4a3494;
        }

        /* Action Block - Placed Simply at the Bottom */
        .action-block {
            width: 100%;
            margin-top: 5px;
        }
        .btn-edit {
            width: 100%;
            background: #6a4fbf;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .btn-edit:hover {
            background: #4a3494;
            transform: scale(1.02);
        }

        footer { text-align: center; padding: 20px; color: #6a4fbf; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>
    {% csrf_token %}

    <div class="header-wrapper">
        <div class="logo"><img src="{% static 'logo.png' %}" alt="Logo"></div>
        <div class="title-area">
            <img src="{% static 'title.png' %}" alt="Title"><br>
            <span style="color: #6a4fbf; font-style: italic; font-size: 14px;">Mood Your Day, Bloom Your Mind.</span>
        </div>
        <div class="hamburger-menu">☰</div>
    </div>

    <div class="divider-line" style="height:1px; background:rgba(106, 79, 191, 0.2); margin:0 50px;"></div>

    <div class="content">
        <div class="diary-card">
            
            <div class="card-header">
                <div class="diary-date" id="date-label">June 10, 2026</div>
                <div class="entry-nav-buttons">
                    <button class="nav-arrow" id="prev-btn" onclick="changeEntry(-1)">◀</button>
                    <button class="nav-arrow" id="next-btn" onclick="changeEntry(1)">▶</button>
                </div>
            </div>

            <div class="mood-section">
                <span class="mood-emoji" id="mood-emoji">😊</span>
                <span class="mood-text" id="mood-text">Happy</span>
            </div>

            <div class="diary-text" id="diary-text-content">
                Loading your memory entry...
            </div>

            <div class="diary-photo-container" id="photo-box">
                <img src="/static/default_diary.jpg" class="diary-photo" id="diary-photo-img" alt="Diary attachment">
            </div>

            <div class="music-player">
                <div class="music-info">
                    <span class="music-icon">🎵</span>
                    <div class="track-details">
                        <span class="now-playing">Now Playing</span>
                        <span class="track-name" id="track-title">Gentle Breeze</span>
                    </div>
                </div>
                <div class="player-controls">
                    <span class="control-btn">⏮</span>
                    <span class="control-btn">⏸</span>
                    <span class="control-btn">⏭</span>
                </div>
            </div>

            <div class="action-block">
                <button type="button" class="btn-edit" onclick="navigateToEditPage()">
                    ✏️ Edit Memory
                </button>
            </div>

        </div>
    </div>

    <footer>
        © 2026 MoodBloom | Mood Your Day, Bloom Your Mind.
    </footer>

    <script>
        // Sample data mimicking database array rows
        const singleDayEntries = [
            {
                id: 101, 
                date: "June 10, 2026",
                emoji: "😊",
                mood: "Happy",
                text: "A lovely walk in the woods with family today. We found a small creek. Felt very calm and connected to nature. 🌸",
                photo: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500",
                track: "Gentle Breeze"
            },
            {
                id: 102,
                date: "June 10, 2026",
                emoji: "😴",
                mood: "Sleepy",
                text: "Studied coding backend architectures with my group friends all afternoon. Ready to sleep early tonight!",
                photo: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500",
                track: "Midnight Lofi"
            }
        ];

        let currentEntryIndex = 0;

        function updateCardUI() {
            if (singleDayEntries.length === 0) return;
            
            const currentEntry = singleDayEntries[currentEntryIndex];
            
            document.getElementById('date-label').innerText = currentEntry.date;
            document.getElementById('mood-emoji').innerText = currentEntry.emoji;
            document.getElementById('mood-text').innerText = currentEntry.mood;
            document.getElementById('diary-text-content').innerText = currentEntry.text;
            document.getElementById('diary-photo-img').src = currentEntry.photo;
            document.getElementById('track-title').innerText = currentEntry.track;

            document.getElementById('prev-btn').disabled = (currentEntryIndex === 0);
            document.getElementById('next-btn').disabled = (currentEntryIndex === singleDayEntries.length - 1);
        }

        function changeEntry(direction) {
            currentEntryIndex += direction;
            updateCardUI();
        }

        // Router handler function to redirect to your edit entry module
        function navigateToEditPage() {
            const currentEntry = singleDayEntries[currentEntryIndex];
            window.location.href = `/edit-entry/?id=${currentEntry.id}&date=${encodeURIComponent(currentEntry.date)}`;
        }

        window.onload = function() {
            updateCardUI();
        };
    </script>
</body>
</html>
