<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Diary History</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    {% load static %}
    <style>
        /* 1. LAYOUT & GRADIENT - Shared Team UI Style */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            display: flex;
            flex-direction: column;
        }
        .profile-card{
    display:flex;
    align-items:center;
    gap:15px;

    background:rgba(255,255,255,.9);
    padding:12px 20px;
    border-radius:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    text-decoration:none;
    color:#4a3494;
}
.profile-avatar{
    width:55px;
    height:55px;
    border-radius:50%;

    background:#ffe7a6;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}

.profile-name{
    font-weight:600;
    font-size:16px;
}

.profile-text{
    font-size:13px;
    color:#7a5fc7;
}
.menu-icon{
    font-size:32px;
    cursor:pointer;
    color:#6a4fbf;
    width:180px;
    text-align:right;
}
.side-nav{
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    height:100%;
    background:#fff;
    box-shadow:-10px 0 30px rgba(0,0,0,.05);
    border-left:1px solid #eee;
    z-index:1000;
    transition:.4s;
    padding:50px 30px;
    box-sizing:border-box;
}

.side-nav.active{
    right:0;
}

.side-nav a{
    display:block;
    padding:18px 0;
    color:#4a3494;
    text-decoration:none;
    font-weight:bold;
    font-size:18px;
}

.close-nav{
    font-size:40px;
    cursor:pointer;
    position:absolute;
    top:15px;
    right:25px;
    color:#6a4fbf;
}

        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; cursor: pointer; }
        .title-area { text-align: center; }
        .title-area img { width: 253px; }
        .hamburger-menu { font-size: 24px; cursor: pointer; color: #6a4fbf; width: 180px; text-align: right; }
        
        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
        
        /* 2. DIARY DISPLAY BOX - Glassmorphism Card Style */
        .diary-card { 
            width: 500px; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            padding: 35px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(106, 79, 191, 0.12);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Header Controls */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(106, 79, 191, 0.15);
            padding-bottom: 15px;
        }

        .diary-date {
            font-size: 24px;
            font-weight: bold;
            color: #6a4fbf;
        }

        .entry-nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-arrow {
            font-size: 22px;
            cursor: pointer;
            color: #6a4fbf;
            user-select: none;
            transition: transform 0.2s, color 0.2s;
            background: none;
            border: none;
            outline: none;
            padding: 0 5px;
        }
        .nav-arrow:hover {
            color: #4a3494;
            transform: scale(1.2);
        }
        .nav-arrow:disabled {
            color: #c5b3e6;
            cursor: not-allowed;
            transform: none;
        }

        /* Mood Badges */
        .mood-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mood-emoji {
            font-size: 40px;
        }
        .mood-text {
            font-size: 18px;
            font-weight: 600;
            color: #4a3494;
        }

        /* Narrative Text Area */
        .diary-text {
            font-family: 'Dancing Script', cursive;
            font-size: 22px;
            line-height: 1.6;
            color: #4a3494;
            margin: 5px 0;
            min-height: 80px;
            white-space: pre-line;
        }

        /* Embedded Photo Box */
        .diary-photo-container {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            max-height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
        }
        .diary-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Music Player Widget */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e0d7ff;
            padding: 12px 20px;
            border-radius: 18px;
            margin-bottom: 5px;
        }
        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .music-icon {
            font-size: 24px;
        }
        .track-details {
            display: flex;
            flex-direction: column;
        }
        .now-playing {
            font-size: 11px;
            color: #8c7dbd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-name {
            font-size: 14px;
            font-weight: bold;
            color: #4a3494;
        }
        .player-controls {
            display: flex;
            gap: 15px;
            font-size: 16px;
            color: #6a4fbf;
            cursor: pointer;
        }
        .control-btn:hover {
            color: #4a3494;
        }

        /* Action Block */
        .action-block {
            width: 100%;
            margin-top: 5px;
        }
        .btn-edit {
            width: 100%;
            background: #6a4fbf;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .btn-edit:hover {
            background: #4a3494;
            transform: scale(1.02);
        }

        footer { text-align: center; padding: 20px; color: #6a4fbf; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>
    {% csrf_token %}

   <div class="header-wrapper">

    <a href="{% url 'profile' %}" class="profile-card">

        <div class="profile-avatar">
            😊
        </div>

        <div>
            <div class="profile-name">
                Hi, {{ user.username }}!
            </div>

            <div class="profile-text">
                Let's have a great day!
            </div>
        </div>

    </a>

    <div class="title-area">
        <img src="{% static 'moodbloom.png' %}">
    </div>

    <div class="menu-icon" onclick="toggleNav()">☰</div>

</div>
<div class="side-nav" id="sideNav">
    <span class="close-nav" onclick="toggleNav()">&times;</span>

    <div style="margin-top:40px;">

    <a href="{% url 'feedback' %}">
        💬 Feedback
    </a>

   <a href="{% url 'logout' %}">
        🚪 Logout
    </a>

  

</div>
</div>
    

    <div class="divider-line" style="height:1px; background:rgba(106, 79, 191, 0.2); margin:0 50px;"></div>

    <div class="content">
        <div class="diary-card">
            
            <div class="card-header">
                <div class="diary-date" id="date-label">June 10, 2026</div>
                <div class="entry-nav-buttons">
                    <button class="nav-arrow" id="prev-btn" onclick="changeEntry(-1)">◀</button>
                    <button class="nav-arrow" id="next-btn" onclick="changeEntry(1)">▶</button>
                </div>
            </div>

            <div class="mood-section">
                <span class="mood-emoji" id="mood-emoji">😊</span>
                <span class="mood-text" id="mood-text">Happy</span>
            </div>

            <div class="diary-text" id="diary-text-content">
                Loading your memory entry...
            </div>

            <div class="diary-photo-container" id="photo-box">
                <img src="{% static 'default_diary.jpg' %}" class="diary-photo" id="diary-photo-img" alt="Diary attachment">
            </div>

            <div class="music-player">
                <div class="music-info">
                    <span class="music-icon">🎵</span>
                    <div class="track-details">
                        <span class="now-playing">Now Playing</span>
                        <span class="track-name" id="track-title">Gentle Breeze</span>
                    </div>
                </div>
                <div class="player-controls">
                    <span class="control-btn">⏮</span>
                    <span class="control-btn">⏸</span>
                    <span class="control-btn">⏭</span>
                </div>
            </div>

            <div class="action-block">
                <button type="button" class="btn-edit" onclick="navigateToEditPage()">
                    ✏️ Edit Memory
                </button>
            </div>

        </div>
    </div>

    <footer>
        © 2026 MoodBloom | Mood Your Day, Bloom Your Mind.
    </footer>

    <script>
        // 核心改动：完美的将 Django 数据库里的内容无缝注入到你原本的数据数组里
        const singleDayEntries = JSON.parse(`[
{% if entries %}
    {% for entry in entries %}
    {
        "id": "{{ entry.id }}",
        "date": "{{ date_str }}",
        "emoji": "{{ entry.emoji|default:'😊' }}",
        "mood": "{{ entry.mood|default:'Happy' }}",
        "text": "{{ entry.diary_text|escapejs }}",
        "photo": "{% if entry.photo %}{{ entry.photo.url }}{% else %}{% static 'default_diary.jpg' %}{% endif %}",
        "track": "{{ entry.track|default:'Gentle Breeze' }}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
{% else %}
    {
        "id": 0,
        "date": "{{ date_str }}",
        "emoji": "🌸",
        "mood": "No Entry",
        "text": "No blossoming memories found for this day. Click Edit to create one!",
        "photo": "{% static 'default_diary.jpg' %}",
        "track": "Silence"
    }
{% endif %}
]`);
        let currentEntryIndex = 0;

        function updateCardUI() {
            if (singleDayEntries.length === 0) return;
            
            const currentEntry = singleDayEntries[currentEntryIndex];
            
            document.getElementById('date-label').innerText = currentEntry.date;
            document.getElementById('mood-emoji').innerText = currentEntry.emoji;
            document.getElementById('mood-text').innerText = currentEntry.mood;
            document.getElementById('diary-text-content').innerText = currentEntry.text;
            document.getElementById('diary-photo-img').src = currentEntry.photo;
            document.getElementById('track-title').innerText = currentEntry.track;

            // 如果只有一条数据（或者是空提示），禁用翻页按钮
            if (singleDayEntries.length <= 1 || currentEntry.id === 0) {
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
            } else {
                document.getElementById('prev-btn').disabled = (currentEntryIndex === 0);
                document.getElementById('next-btn').disabled = (currentEntryIndex === singleDayEntries.length - 1);
            }
        }

        function changeEntry(direction) {
            currentEntryIndex += direction;
            updateCardUI();
        }

        // 路由处理器：安全地跳往你的修改页面
        function navigateToEditPage() {
            const currentEntry = singleDayEntries[currentEntryIndex];
            
            if (currentEntry.id === 0) {
                // 如果是空数据，带上当前日期跳去创建或编辑页
                window.location.href = `/moodentry/?date=${encodeURIComponent(currentEntry.date)}`;
            } else {
                // 正常数据带上数据库真实 ID 进行修改
                window.location.href = `/edit-entry/?id=${currentEntry.id}&date=${encodeURIComponent(currentEntry.date)}`;
            }
        }

        window.onload = function() {
            updateCardUI();
        };
     function toggleNav(){
    console.log("clicked");
    document.getElementById("sideNav").classList.toggle("active");
}
    </script>
</body>
</html>
