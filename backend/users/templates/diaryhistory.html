{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Diary History</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    {% load static %}
    <style>
        /* 1. LAYOUT & GRADIENT - Shared Team UI Style */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            display: flex;
            flex-direction: column;
        }
        .profile-card{
            display:flex;
            align-items:center;
            gap:15px;
            background:rgba(255,255,255,.9);
            padding:12px 20px;
            border-radius:25px;
            box-shadow:0 5px 15px rgba(0,0,0,.08);
            text-decoration:none;
            color:#4a3494;
        }
        .profile-avatar{
            width:55px;
            height:55px;
            border-radius:50%;
            background:#ffe7a6;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
        }
        .profile-name{
            font-weight:600;
            font-size:16px;
        }
        .profile-text{
            font-size:13px;
            color:#7a5fc7;
        }
        .menu-icon{
            font-size:32px;
            cursor:pointer;
            color:#6a4fbf;
            width:180px;
            text-align:right;
        }
        .side-nav{
            position:fixed;
            top:0;
            right:-300px;
            width:280px;
            height:100%;
            background:#fff;
            box-shadow:-10px 0 30px rgba(0,0,0,.05);
            border-left:1px solid #eee;
            z-index:1000;
            transition:.4s;
            padding:50px 30px;
            box-sizing:border-box;
        }
        .side-nav.active{
            right:0;
        }
        .side-nav a{
            display:block;
            padding:18px 0;
            color:#4a3494;
            text-decoration:none;
            font-weight:bold;
            font-size:18px;
        }
        .close-nav{
            font-size:40px;
            cursor:pointer;
            position:absolute;
            top:15px;
            right:25px;
            color:#6a4fbf;
        }

        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; cursor: pointer; }
        .title-area { text-align: center; }
        .title-area img { width: 420px; }
        .hamburger-menu { font-size: 24px; cursor: pointer; color: #6a4fbf; width: 180px; text-align: right; }
        
        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 30px; }
        
        /* 2. DIARY DISPLAY BOX - Glassmorphism Card Style */
        .diary-card { 
            width: 500px; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(12px);
            padding: 35px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 30px rgba(106, 79, 191, 0.12);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Card Header Controls */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(106, 79, 191, 0.15);
            padding-bottom: 15px;
        }

        .diary-date {
            font-size: 24px;
            font-weight: bold;
            color: #6a4fbf;
        }

        .entry-nav-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .nav-arrow {
            font-size: 22px;
            cursor: pointer;
            color: #6a4fbf;
            user-select: none;
            transition: transform 0.2s, color 0.2s;
            background: none;
            border: none;
            outline: none;
            padding: 0 5px;
        }
        .nav-arrow:hover {
            color: #4a3494;
            transform: scale(1.2);
        }
        .nav-arrow:disabled {
            color: #c5b3e6;
            cursor: not-allowed;
            transform: none;
        }

        /* Mood Badges */
        .mood-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .mood-emoji {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }
        .mood-text {
            font-size: 18px;
            font-weight: 600;
            color: #4a3494;
        }

        /* Narrative Text Area */
        .diary-text {
            font-family: 'Segoe UI', Arial, sans-serif; 
            font-size: 20px;
            line-height: 1.6;
            color: #4a3494;
            margin: 5px 0;
            min-height: 80px;
            white-space: pre-line;
        }

       .diary-photo-container {
    width: 100%;
    display: grid;
    /* 核心：无论有几张，强制分 3 列，这样大小就统一了 */
    grid-template-columns: repeat(3, 1fr); 
    gap: 10px;
    padding: 8px;
    box-sizing: border-box;
    background: rgba(255, 255, 255, 0.4);
    border-radius: 20px;
}

/* 修改后的照片样式：保持正方形或固定高度 */
.diary-photo {
    width: 100%;
    /* 通过 aspect-ratio 强制保持正方形，这样大小永远一样 */
    aspect-ratio: 1 / 1; 
    object-fit: cover;
    border-radius: 12px;
}
        /* Music Player Widget */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e0d7ff;
            padding: 12px 20px;
            border-radius: 18px;
            margin-bottom: 5px;
        }
        .music-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .music-icon {
            font-size: 24px;
        }
        .track-details {
            display: flex;
            flex-direction: column;
        }
        .now-playing {
            font-size: 11px;
            color: #8c7dbd;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .track-name {
            font-size: 14px;
            font-weight: bold;
            color: #4a3494;
        }
        .player-controls {
            display: flex;
            gap: 15px;
            font-size: 16px;
            color: #6a4fbf;
            cursor: pointer;
        }
        .control-btn:hover {
            color: #4a3494;
        }

        /* Action Block */
        .action-block {
            width: 100%;
            margin-top: 5px;
        }
        .btn-edit {
            width: 100%;
            background: #6a4fbf;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-sizing: border-box;
        }
        .btn-edit:hover {
            background: #4a3494;
            transform: scale(1.02);
        }

        footer { text-align: center; padding: 20px; color: #6a4fbf; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>
    {% csrf_token %}

   <div class="header-wrapper">
       <a href="{% url 'mainpage' %}" class="profile-card">
    <div class="profile-avatar">
        🏠
    </div>

    <div>
        <div class="profile-name">
            Main Page
        </div>

        <div class="profile-text">
            Back to Calendar
        </div>
    </div>
</a>
        <div class="title-area"><img src="{% static 'moodbloom.png' %}"></div>
        <div class="menu-icon" onclick="toggleNav()">☰</div>
    </div>

    <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top:40px;">
            <a href="{% url 'feedback' %}">💬 Feedback</a>
            <a href="{% url 'logout' %}">🚪 Logout</a>
            <a href="javascript:void(0);" onclick="clickDeleteAccount()" style="color:#e57373; margin-top:50px; border:none; cursor:pointer;">🗑️ Delete Account</a>
        </div>
    </div>
    
    <div class="divider-line" style="height:1px; background:rgba(106, 79, 191, 0.2); margin:0 50px;"></div>

    <div class="content">
        <div class="diary-card">
            
            <div class="card-header">
                <div class="diary-date" id="date-label">June 10, 2026</div>
                <div class="entry-nav-buttons">
                    <button class="nav-arrow" id="prev-btn" onclick="changeEntry(-1)">◀</button>
                    <button class="nav-arrow" id="next-btn" onclick="changeEntry(1)">▶</button>
                </div>
            </div>

            <div class="mood-section">
                <img id="mood-emoji" class="mood-emoji" src="" alt="Mood">
                <span class="mood-text" id="mood-text">Happy</span>
            </div>

            <div class="diary-text" id="diary-text-content">Loading your memory entry...</div>

            <div class="diary-photo-container" id="photo-box"></div>

            <div class="music-player">
                <div class="music-info">
                    <span class="music-icon">🎵</span>
                    <div class="track-details">
                        <span class="now-playing">Now Playing</span>
                        <span class="track-name" id="track-title">Gentle Breeze</span>
                    </div>
                </div>
                <audio id="historyAudio" controls style="width:100%; margin-top:10px;"></audio>
            </div>
            
            <div class="action-block">
                <button type="button" class="btn-edit" onclick="navigateToEditPage()">
                    ✏️ Edit Memory
                </button>
            </div>

        </div>
    </div>

    <footer>© 2026 MoodBloom | Mood Your Day, Bloom Your Mind.</footer>

    <script>
        // ✨ 核心修复：完美拉取该条日记绑定的所有关联照片，转化为前端安全通用的纯数组形式
        const singleDayEntries = JSON.parse(`[
{% if entries %}
    {% for entry in entries %}
    {
        "id": {{ entry.id }},
        "date": "{{ date_str }}",
        "emoji": "{{ entry.emoji|default:'😊' }}",
        "mood": "{{ entry.mood|default:'Happy' }}",
        "text": "{{ entry.diary_text|escapejs }}",
        "photos": [
            {% for p in entry.photos.all %}
                "{{ p.image.url }}"{% if not forloop.last %},{% endif %}
            {% endfor %}
        ],
        "track": "{% if entry.selected_music %}{{ entry.selected_music.title }}{% else %}No Song{% endif %}",
        "track_url": "{% if entry.selected_music %}{{ entry.selected_music.audio_file.url }}{% endif %}"
    }{% if not forloop.last %},{% endif %}
    {% endfor %}
{% else %}
    {
        "id": 0,
        "date": "{{ date_str }}",
        "emoji": "🌸",
        "mood": "No Entry",
        "text": "No blossoming memories found for this day. Click Edit to create one!",
        "photos": [],
        "track": "Silence"
    }
{% endif %}
]`);

        const moodImageMap = {
            "Happy": "happy.png", "Kiss": "kiss.png", "Yeah": "happy.png", "Fighting": "motivated.png",
            "Good": "good.png", "Lovely": "lovely.png", "Admire": "admire.png", "Warm": "warm.png",
            "Energetic": "energetic.png", "Motivated": "motivated.png", "Sad": "sad.png", "Sick": "sick.png",
            "Cringe": "awkward.png", "Tired": "sleepy.png", "Exhausted": "exhausted.png", "Guilty": "guilty.png",
            "Afraid": "afraid.png", "Neutral": "neutral.png", "Shy": "shy.png", "Sleepy": "sleepy.png",
            "Curious": "curious.png", "Angry": "angry.png", "Shock": "shock.png", "Trick": "mischievous.png",
            "Awkward": "awkward.png"
        };

        let currentEntryIndex = 0;

        function updateCardUI() {
            if (singleDayEntries.length === 0) return;
            
            const currentEntry = singleDayEntries[currentEntryIndex];
            
            document.getElementById('date-label').innerText = currentEntry.date;
            document.getElementById('mood-text').innerText = currentEntry.mood;

            const moodImageFile = moodImageMap[currentEntry.mood];
            if (moodImageFile) {
                document.getElementById('mood-emoji').src = `/static/emojis/${moodImageFile}`;
            }

            document.getElementById('diary-text-content').innerText = currentEntry.text;

            // ✨ ✨ ✨ 核心修改：动态循环把每张属于本条 MoodEntry 的照片平铺输出 ✨ ✨ ✨
            const photoBox = document.getElementById('photo-box');
            photoBox.innerHTML = ''; // 每次翻页清空上一张的多图缓存

            if (currentEntry.photos && currentEntry.photos.length > 0) {
                photoBox.style.display = 'grid'; // 启动 Grid 排版
                currentEntry.photos.forEach(photoUrl => {
                    const img = document.createElement('img');
                    img.src = photoUrl;
                    img.className = 'diary-photo';
                    img.alt = 'Diary attachment';
                    photoBox.appendChild(img);
                });
            } else {
                photoBox.style.display = 'none'; // 没照片就自动收起
            }

            document.getElementById('track-title').innerText = currentEntry.track;

            const historyAudio = document.getElementById('historyAudio');
            historyAudio.src = currentEntry.track_url || "";

            if (singleDayEntries.length <= 1 || currentEntry.id === 0) {
                document.getElementById('prev-btn').disabled = true;
                document.getElementById('next-btn').disabled = true;
            } else {
                document.getElementById('prev-btn').disabled = (currentEntryIndex === 0);
                document.getElementById('next-btn').disabled = (currentEntryIndex === singleDayEntries.length - 1);
            }
        }

        function changeEntry(direction) {
            currentEntryIndex += direction;
            updateCardUI();
        }

        function navigateToEditPage() {
            const currentEntry = singleDayEntries[currentEntryIndex];
            if (currentEntry.id === 0) {
                window.location.href = `/moodentry/?date=${encodeURIComponent(currentEntry.date)}`;
            } else {
                window.location.href = `/edit-entry/?id=${currentEntry.id}&date=${encodeURIComponent(currentEntry.date)}`;
            }
        }

        window.onload = function() {
            updateCardUI();
        };

        function toggleNav(){
            document.getElementById("sideNav").classList.toggle("active");
        }

        async function clickDeleteAccount() {
    // 1. Double confirmation to prevent accidental clicks
    const confirmDelete = confirm("⚠️ WARNING: This action will permanently delete all your mood logs, photos, and personal data. This process is irreversible. Are you sure you want to delete your account?");
    
    if (confirmDelete) {
        try {
            // 2. Fetch request with proper security headers
            const response = await fetch("{% url 'delete_account' %}", {
                method: "POST",
                headers: { 
                    "X-Requested-With": "XMLHttpRequest",
                    "X-CSRFToken": "{{ csrf_token }}" // Critical for Django security
                }
            });
            
            const data = await response.json();
            
            // 3. Handle response
            if (data.status === 'success') {
                alert("🌸 Your account has been successfully deleted. Thank you for using MoodBloom, we hope to see you again!");
                window.location.href = "{% url 'login' %}"; 
            } else {
                alert("❌ Operation failed: " + data.message);
            }
        } catch (error) {
            console.error("Error:", error);
            alert("❌ A network error occurred. Please check your connection and try again.");
        }
    }
}
    </script>
</body>
</html>
