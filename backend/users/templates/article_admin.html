{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Manage Articles</title>

<style>

body{
    font-family:'Segoe UI';
    background:#f7f3ff;
    padding:40px;
}

.container{
    background:white;
    padding:30px;
    border-radius:25px;
}

h1{
    color:#7a5fc7;
}

.btn{
    background:#b39ddb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
}

</style>
</head>

<body>

<div class="container">

<h1>📚 Manage Articles</h1>

<button class="btn">
    + Add Article
</button>

<table>

<tr>
    <th>ID</th>
    <th>Title</th>
    <th>Category</th>
    <th>Actions</th>
</tr>

{% for article in articles %}

<tr>

<td>{{ article.id }}</td>

<td>{{ article.title }}</td>

<td>{{ article.category }}</td>

<td>

<button class="btn">
    Edit
</button>

<button class="btn">
    Delete
</button>

</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
