{% load static %}
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MoodBloom Admin</title>

<style>

body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(
    180deg,
    #ffffff,
    #f7f3ff,
    #ece4ff
    );
    min-height:100vh;
}

.header{
    background:#b39ddb;
    color:white;
    padding:20px 40px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    margin:0;
}

.main{
    padding:40px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-bottom:40px;
}

.stat-card{
    background:white;
    border-radius:25px;
    padding:25px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.stat-number{
    font-size:32px;
    font-weight:bold;
    color:#7a5fc7;
}

.section{
    background:white;
    border-radius:30px;
    padding:30px;
    margin-bottom:30px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.section-title{
    font-size:24px;
    font-weight:bold;
    color:#7a5fc7;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.card{
    background:#faf8ff;
    border-radius:20px;
    padding:20px;
    border:1px solid #eee;
}

.card h3{
    margin-top:0;
    color:#7a5fc7;
}

.item{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

.btn{
    background:#b39ddb;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:12px;
    cursor:pointer;
}

.btn:hover{
    background:#9c89d8;
}
.card-link{
    text-decoration:none;
    color:inherit;
}

.card-link .card{
    transition:.3s;
}

.card-link .card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

</style>
</head>

<body>

<div class="header">
    <h1>🌸 MoodBloom Admin Portal</h1>
    <div>
        Welcome Admin |
        <a href="{% url 'logout' %}" style="color:white;">
            Logout
        </a>
    </div>
</div>

<div class="main">

    <!-- STATS -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-number">86</div>
            Users
        </div>

        <div class="stat-card">
            <div class="stat-number">1245</div>
            Mood Entries
        </div>

        <div class="stat-card">
            <div class="stat-number">530</div>
            Photos
        </div>

        <div class="stat-card">
            <div class="stat-number">28</div>
            Articles
        </div>

    </div>

    <!-- AUTH -->

    <div class="section">

        <div class="section-title">
            🔐 Authentication & Authorization
        </div>

        <div class="grid">

            <div class="card">
                <h3>Groups</h3>

                <div class="item">
                    Admin
                    <button class="btn">Manage</button>
                </div>

                <div class="item">
                    Moderator
                    <button class="btn">Manage</button>
                </div>

                <div class="item">
                    User
                    <button class="btn">Manage</button>
                </div>

            </div>

            <div class="card">
                <h3>Users</h3>

                <div class="item">
                    View Users
                    <button class="btn">Open</button>
                </div>

                <div class="item">
                    Add User
                    <button class="btn">Add</button>
                </div>

            </div>

        </div>

    </div>

    <!-- USERS SECTION -->

    <div class="section">

        <div class="section-title">
            🌷 User Management
        </div>

        <div class="grid">

            <a href="{% url 'article_admin' %}" class="card-link">
    <div class="card">
        <h3>📚 Articles</h3>
        <p>Add, edit and publish articles.</p>
    </div>

    



</div>

</body>
</html>
