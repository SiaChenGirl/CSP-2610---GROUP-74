{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Search Memories</title>
    <style>
        /* 1. 基础样式：延续新版的轻盈感 */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            overflow-x: hidden;
        }

        /* 2. 导航栏 */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-area img { width: 253px; }
        .menu-icon { font-size: 35px; cursor: pointer; color: #6a4fbf; width: 180px; text-align: right; }

        /* 侧边抽屉 (合并了圆形导航的功能) */
        .side-nav {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%;
            background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px);
            box-shadow: -10px 0 30px rgba(106, 79, 191, 0.2); z-index: 1000;
            transition: 0.4s; padding: 50px 30px; box-sizing: border-box;
        }
        .side-nav.active { right: 0; }
        .side-nav a { display: block; padding: 18px 0; color: #4a3494; text-decoration: none; font-weight: bold; border-bottom: 1px solid #f0f0f0; }
        .close-nav { font-size: 40px; cursor: pointer; position: absolute; top: 15px; right: 25px; color: #b39ddb; }

        .divider-line { height: 1px; background: rgba(106, 79, 191, 0.1); margin: 0 50px; }

        /* 3. 搜索主区域 */
        .search-main { display: flex; justify-content: center; gap: 40px; padding: 40px 60px; max-width: 1200px; margin: 0 auto; }
        
        /* 左侧过滤器 (Pills) */
        .filter-section { display: flex; flex-direction: column; gap: 15px; width: 180px; }
        .filter-pill { 
            background: white; padding: 15px 25px; border-radius: 30px; 
            font-weight: bold; color: #6a4fbf; cursor: pointer; text-align: center;
            box-shadow: 0 4px 15px rgba(106, 79, 191, 0.1); transition: 0.3s;
            border: 2px solid transparent;
        }
        .filter-pill:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(106, 79, 191, 0.15); }
        .filter-pill.active { border-color: #6a4fbf; background: #f8f6ff; }

        /* 右侧结果箱 (Glassmorphism) */
        .results-container { 
            background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(15px); 
            border-radius: 40px; padding: 40px; 
            flex: 1; min-height: 500px; 
            box-shadow: 0 10px 30px rgba(106, 79, 191, 0.05);
            border: 1px solid white; text-align: center;
        }

        /* 搜索工具样式 */
        .inline-tool { display: none; margin-bottom: 30px; animation: fadeIn 0.5s; }
        .calendar-input { padding: 15px; border-radius: 15px; border: 2px solid #e8e0ff; color: #4a3494; font-weight: bold; outline: none; background: white; }
        .keyword-input { width: 100%; padding: 18px 30px; border-radius: 50px; border: 2px solid #e8e0ff; outline: none; font-size: 16px; box-sizing: border-box; color: #4a3494; box-shadow: 0 5px 15px rgba(0,0,0,0.02); }
        
        .mood-options { display: none; justify-content: center; gap: 20px; margin-top: 20px; animation: fadeIn 0.5s; }
        .mood-options img { width: 70px; height: 70px; cursor: pointer; transition: 0.3s; opacity: 0.7; }
        .mood-options img:hover { transform: scale(1.2); opacity: 1; }

        /* 4. 底部快捷导航 */
        .quick-nav { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; background: rgba(255, 255, 255, 0.8); padding: 10px 30px; border-radius: 50px; backdrop-filter: blur(10px); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .quick-item { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.3s; cursor: pointer; }
        .quick-item img { width: 22px; opacity: 0.6; }
        .quick-item:hover { background: #f0ebff; }
        .quick-item.active { background: #6a4fbf; }
        .quick-item.active img { filter: brightness(0) invert(1); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        footer { margin-top: 50px; color: #b39ddb; font-size: 13px; padding-bottom: 100px; }
    </style>
</head>
<body>

    <!-- 侧边导航 -->
    <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top: 40px;">
            <a href="{% url 'mainpage' %}">Home</a>
            <a href="{% url 'profile' %}">My Profile</a>
            <a href="{% url 'feedback' %}">Feedback</a>
            <a href="{% url 'logout' %}" style="color: #e57373; margin-top: 50px; border: none;">Logout</a>
        </div>
    </div>

    <div class="header-wrapper">
        <div class="logo"><img src="{% static 'logo.png' %}"></div>
        <div class="title-area"><img src="{% static 'title.png' %}"></div>
        <div class="menu-icon" onclick="toggleNav()">☰</div>
    </div>
    
    <div class="divider-line"></div>

    <div class="search-main">
        <!-- 过滤器列表 -->
        <div class="filter-section">
            <div class="filter-pill" id="pill-date" onclick="showTool('calendarBox', this)">Date</div>
            <div class="filter-pill" id="pill-mood" onclick="showTool('moodGrid', this)">Mood</div>
            <div class="filter-pill" id="pill-key" onclick="showTool('keywordBox', this)">Keyword</div>
        </div>

        <!-- 结果容器 -->
        <div class="results-container">
            <!-- 日历搜索 -->
            <div class="inline-tool" id="calendarBox">
                <h3 style="color:#6a4fbf; font-family: 'Dancing Script', cursive; font-size: 28px;">When did it happen?</h3>
                <input type="date" class="calendar-input" onchange="performSearch('date', this.value)">
            </div>

            <!-- 关键字搜索 -->
            <div class="inline-tool" id="keywordBox">
                <h3 style="color:#6a4fbf; margin-bottom: 20px;">Search by thoughts...</h3>
                <input type="text" class="keyword-input" placeholder="Type a keyword (e.g. Exam, Coffee, Happy)..." onkeyup="performSearch('key', this.value)">
            </div>

            <!-- 表情过滤 -->
            <div class="mood-options" id="moodGrid">
                <img src="{% static 'emojis/happy.png' %}" onclick="performSearch('mood', 'Happy')" title="Happy">
                <img src="{% static 'emojis/sad.png' %}" onclick="performSearch('mood', 'Sad')" title="Sad">
                <img src="{% static 'emojis/neutral.png' %}" onclick="performSearch('mood', 'Neutral')" title="Neutral">
                <img src="{% static 'emojis/angry.png' %}" onclick="performSearch('mood', 'Angry')" title="Angry">
            </div>

            <!-- 默认提示与结果列表 -->
            <div id="defaultMsg" style="color:#b39ddb; margin-top:120px; font-size: 16px; font-style: italic;">
                "Your memories are blooming. Select a filter to find them."
            </div>
            
            <div id="resultsList" style="margin-top:30px; text-align: left; padding: 0 20px;">
                <!-- 搜索结果渲染区 -->
            </div>
        </div>
    </div>

    <!-- 底部快捷导航 -->
    <div class="quick-nav">
        <div class="quick-item active"><img src="{% static 'icons/search.png' %}"></div>
        <!-- 重点修复：diaryhistory -> article -->
        <div class="quick-item" onclick="location.href='{% url 'article' %}'"><img src="{% static 'icons/book.png' %}"></div>
        <div class="quick-item" onclick="location.href='{% url 'dashboard' %}'"><img src="{% static 'icons/stats.png' %}"></div>
        <div class="quick-item" onclick="location.href='{% url 'gallery' %}'"><img src="{% static 'icons/camera.png' %}"></div>
    </div>

    <center><footer>© 2026 MoodBloom | Mood your day, Bloom your mind.</footer></center>

    <script>
        function toggleNav() { document.getElementById('sideNav').classList.toggle('active'); }

        function showTool(toolId, pillElement) {
            document.querySelectorAll('.inline-tool, .mood-options').forEach(t => t.style.display = 'none');
            document.getElementById('defaultMsg').style.display = 'none';
            const target = document.getElementById(toolId);
            target.style.display = (toolId === 'moodGrid') ? 'flex' : 'block';
            document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
            pillElement.classList.add('active');
        }

        function performSearch(type, value) {
            const list = document.getElementById('resultsList');
            if(!value) return;
            list.innerHTML = `
                <div style="padding:15px; background:white; border-radius:15px; margin-bottom:10px; border-left: 5px solid #6a4fbf;">
                    <small style="color:#aaa;">Result for ${type}: <b>${value}</b></small>
                    <p style="margin:5px 0;">Finding your memories in the database...</p>
                </div>
            `;
        }
    </script>
</body>
</html>
