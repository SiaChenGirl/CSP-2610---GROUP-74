{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Feedback</title>
    <style>
        /* 1. 基础样式 */
        /* 1. 基础样式 */
body { 
    margin: 0; 
    font-family: 'Segoe UI', Arial, sans-serif; 
    /* --- UPDATED BACKGROUND START --- */
    background-image: url("{% static 'background.png' %}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    /* --- UPDATED BACKGROUND END --- */
    min-height: 100vh; 
    color: #4a3494;
    display: flex; /* Keeping this to ensure footer stays at bottom */
    flex-direction: column;
}
        .profile-card{
    position:absolute;
    top:25px;
    left:25px;

    display:flex;
    align-items:center;
    gap:15px;

    background:rgba(255,255,255,.9);
    padding:12px 20px;
    border-radius:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    text-decoration:none;
    color:#4a3494;

    z-index:999;
}

.profile-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    background:#ffe7a6;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:26px;
}

.profile-name{
    font-weight:600;
    font-size:16px;
}

.profile-text{
    font-size:13px;
    color:#7a5fc7;
}

.menu-icon{
    position:absolute;
    top:25px;
    right:25px;

    font-size:34px;
    color:#6a4fbf;
    cursor:pointer;

    z-index:999;
}

.side-nav{
    position:fixed;
    top:0;
    right:-300px;

    width:280px;
    height:100%;

    background:white;
    box-shadow:-10px 0 30px rgba(0,0,0,.08);

    transition:.4s;
    z-index:2000;

    padding:50px 30px;
    box-sizing:border-box;
}

.side-nav.active{
    right:0;
}

.close-nav{
    position:absolute;
    top:15px;
    right:25px;

    font-size:40px;
    cursor:pointer;
    color:#6a4fbf;
}

.side-nav a{
    display:block;
    padding:18px 0;

    color:#4a3494;
    text-decoration:none;

    font-weight:bold;
    font-size:18px;

    border-bottom:1px solid #f3f3f3;
}

.side-nav a:hover{
    color:#b39ddb;
}

        /* 2. 头部导航 */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 110px; } 
        .title-img img { width: 230px; }
        .back-link { text-decoration: none; color: #6a4fbf; font-weight: bold; font-size: 16px; transition: 0.3s; }
        .back-link:hover { opacity: 0.7; }
        .header-line { border: 0; height: 1px; background: rgba(106, 79, 191, 0.2); margin: 0 40px 30px 40px; }
        .logo{
    text-align:center;
    margin-bottom:20px;
}

.logo img { width: 180px; cursor: pointer; }
        /* 3. 反馈卡片容器 */
        .container { 
            max-width: 500px; 
            margin: 50px auto; 
            background: white; 
            padding: 45px; 
            border-radius: 40px; 
            box-shadow: 0 15px 35px rgba(106, 79, 191, 0.1); 
            text-align: center; 
        }

        /* 评分星星 */
        .star-rating { margin: 20px 0; }
        .star { font-size: 40px; color: #eee; cursor: pointer; transition: 0.2s; margin: 0 5px; }
        .star.active { color: #ffcc00; text-shadow: 0 0 10px rgba(255, 204, 0, 0.3); }

        /* 输入框样式 */
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            border-radius: 15px; 
            border: 1px solid #e8e0ff; 
            box-sizing: border-box; 
            background: #fafaff; 
            font-size: 15px;
            transition: 0.3s;
            outline: none;
            color: #4a3494;
        }
        input:focus, textarea:focus { border-color: #b39ddb; background: white; box-shadow: 0 0 10px rgba(179, 157, 219, 0.15); }

        /* 按钮 */
        .btn { 
            width: 100%; 
            padding: 15px; 
            background: #6a4fbf; 
            border: none; 
            border-radius: 25px; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px;
            margin-top: 15px;
            transition: 0.3s;
        }
        .btn:hover { background: #5a3ea3; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(106, 79, 191, 0.2); }
        
        footer { text-align: center; padding: 25px 0 40px; color: #6a4fbf; font-weight: bold; font-size: 14px; width: 100%; margin-top: auto; }

    </style>
</head>
<body>
    
   
    <a href="{% url 'mainpage' %}" class="profile-card">

    <div class="profile-avatar">
        🏠
    </div>

    <div>
        <div class="profile-name">
            Mainpage
        </div>

        <div class="profile-text">
            Return to calendar
        </div>
    </div>

</a>

<div class="menu-icon" onclick="toggleNav()">☰</div>

<div class="side-nav" id="sideNav">

    <span class="close-nav" onclick="toggleNav()">&times;</span>

    <div style="margin-top:40px;">

        <a href="{% url 'feedback' %}">
            💬 Feedback
        </a>

        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit"
                    onclick="return confirm('Are you sure you want to log out?')">
                🚪 Logout
            </button>
        </form>

        

    </div>

</div>

<hr class="header-line">
    <div class="logo">
    <img src="{% static 'moodbloom.png' %}" alt="MoodBloom Logo">
</div>
    <div class="container">
        <h2 style="color:#6a4fbf; margin-top: 0;">Feedback</h2>
        <p style="color: #b39ddb; font-size: 14px;">We'd love to hear your thoughts!</p>
        
        <!-- 星级评分 -->
        <div class="star-rating" id="stars">
            <span class="star" onclick="rate(1)">★</span>
            <span class="star" onclick="rate(2)">★</span>
            <span class="star" onclick="rate(3)">★</span>
            <span class="star" onclick="rate(4)">★</span>
            <span class="star" onclick="rate(5)">★</span>
        </div>

        <!-- 这里的 ID 保持不变，确保你的 JS 能够获取数据 -->
        <input type="email" id="email_input" placeholder="Your Email" value="{{ request.user.email }}">
        <textarea id="content_input" placeholder="How can we improve MoodBloom?" rows="5"></textarea>
        
        <button class="btn" onclick="submitFeedback()">Submit Feedback</button>
    </div>

    <footer>© 2026 MoodBloom | Mood your day, Bloom your mind.</footer>

    <script>
        function toggleNav() {
    document.getElementById('sideNav').classList.toggle('active');
}
        let selectedRating = 0;

        // 处理评分视觉效果
        function rate(n) {
            selectedRating = n;
            const stars = document.querySelectorAll('.star');
            stars.forEach((star, i) => {
                star.classList.toggle('active', i < n);
            });
        }

        // 提交反馈逻辑（完整保留你的 AJAX 实现）
        function submitFeedback() {
            const email = document.getElementById('email_input').value;
            const content = document.getElementById('content_input').value;

            if (selectedRating === 0 || !content) {
                alert("Please provide a rating and your feedback! 🌸");
                return;
            }

            // 发送到 Django 后端
            fetch("{% url 'feedback' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    rating: selectedRating,
                    email: email,
                    content: content,
                    subject: "General Feedback"
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Thank you for your feedback! It helps us grow. 🌸'); 
                    location.href = "{% url 'mainpage' %}";
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again later.');
            });
        }
    </script>
</body>
</html>
