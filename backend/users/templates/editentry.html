{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Edit Memory</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <style>
        /* 1. Overall Theme Layout */
       body { 
        margin: 0; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        /* Remove the purple gradients and use background.png */
        background-image: url("{% static 'editentry_background.png' %}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh; 
        color: #4a3494;
        display: flex;
        flex-direction: column;
    }
    .profile-card{
    position:fixed;
    top:25px;
    left:25px;

    display:flex;
    align-items:center;
    gap:15px;

    background:rgba(255,255,255,.9);
    padding:12px 20px;
    border-radius:25px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    text-decoration:none;
    color:#4a3494;

    z-index:999;
}

.profile-avatar{
    width:55px;
    height:55px;
    border-radius:50%;

    background:#ffe7a6;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
}

.profile-name{
    font-weight:600;
    font-size:16px;
}

.profile-text{
    font-size:13px;
    color:#7a5fc7;
}

      /* 2. Header: Center the logo */
   .header-wrapper{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px 50px;
    position:relative;
}

.menu-icon{
    position:absolute;
    right:30px;
    font-size:35px;
    cursor:pointer;
    color:#6a4fbf;
}
    /* Hide the side logo and menu icon if you want a clean center */
    .logo { 
        display: none; 
    }
    
    /* Keep your existing .box and other styles below... */
        .title-img img { width: 253px; }
        /* Side Menu Drawer */
        .side-nav { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(10px); box-shadow: -10px 0 30px rgba(0, 0, 0, 0.05); z-index: 1000; transition: 0.4s; padding: 50px 30px; box-sizing: border-box; }
        .side-nav.active { right: 0; }
        .side-nav a { display: block; padding: 18px 0; color: #4a3494; text-decoration: none; font-weight: bold; border-bottom: 1px solid #f0f0f0; }
        .side-nav a:hover { color: #b39ddb; padding-left: 10px; background: #fcfcfc; }
        .close-nav { font-size: 40px; cursor: pointer; position: absolute; top: 15px; right: 25px; color: #b39ddb; }

        /* 3. Core Structural Columns */
        .main-container{
    display:flex;
    justify-content:center;
    padding:20px;
}

.entry-card{
    width:900px;
    background:rgba(255,255,255,.92);
    border-radius:35px;
    padding:35px;
    box-shadow:0 15px 40px rgba(106,79,191,.15);
}

.date-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.date-display{
    font-size:38px;
    font-weight:700;
    color:#6a4fbf;
}

.nav-arrow{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:white;
    box-shadow:0 5px 15px rgba(0,0,0,.1);
    cursor:pointer;
    font-size:25px;
}

.mood-section{
    display:flex;
    align-items:center;
    gap:25px;
    margin-bottom:25px;
}

.main-mood{
    width:110px;
    height:110px;
}

#moodName{
    font-size:42px;
    font-weight:700;
    color:#6a4fbf;
}

#entryTime{
    margin-top:8px;
    color:#888;
}

.diary-box textarea{
    width:100%;
    min-height:180px;
    border:none;
    background:#faf8ff;
    border-radius:20px;
    padding:25px;
    font-size:22px;
    font-family:'Dancing Script',cursive;
}

.section-title{
    margin-top:25px;
    margin-bottom:15px;
    font-weight:700;
    color:#6a4fbf;
}

.photo-gallery{
    display:flex;
    gap:15px;
}

.photo-item,
.photo-add{
    width:150px;
    height:120px;
    border-radius:15px;
}

.photo-item{
    width:150px;
    height:120px;
    object-fit:cover;
    border-radius:15px;
}

.photo-add{
    border:2px dashed #d6c8ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:45px;
    color:#b39ddb;
    cursor:pointer;
}

.song-card{
    background:#faf8ff;
    border-radius:20px;
    padding:20px;
    display:flex;
    align-items:center;
    gap:20px;
}

.album-cover{
    width:70px;
    height:70px;
    border-radius:12px;
}

.song-info{
    flex:1;
}

.play-btn{
    width:55px;
    height:55px;
    border:none;
    border-radius:50%;
    background:#8b6dff;
    color:white;
    cursor:pointer;
}

.edit-btn{
    width:100%;
    margin-top:30px;
    padding:18px;
    border:none;
    border-radius:50px;
    background:linear-gradient(
        90deg,
        #6a4fbf,
        #9d7cff
    );
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

.delete-btn{
    width:100%;
    margin-top:15px;
    padding:18px;
    border:none;
    border-radius:50px;
    background:#ff7f8c;
    color:white;
    font-size:18px;
    font-weight:700;
    cursor:pointer;
}

        /* Media Elements */
        .search-container { position: relative; }
        .photo-slots { display: flex; gap: 10px; }
        h3 { color: #b39ddb; font-size: 12px; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        footer { text-align: center; padding: 20px 0 30px; color: #6a4fbf; font-weight: bold; font-size: 14px; width: 100%; margin-top: auto; }
    </style>
</head>
<body>

   <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top:40px;">


    <a href="{% url 'feedback' %}">
        💬 Feedback
    </a>

   <a href="{% url 'logout' %}">
        🚪 Logout
    </a>

    

</div>
    </div>
<div class="header-wrapper">

    <a href="{% url 'profile' %}" class="profile-card">

        <div class="profile-avatar">
            😊
        </div>

        <div>
            <div class="profile-name">
                Hi, {{ user.username }}!
            </div>

            <div class="profile-text">
                Let's have a great day!
            </div>
        </div>

    </a>

    <div class="title-img">
        <img src="{% static 'moodbloom.png' %}">
    </div>

    <div class="menu-icon" onclick="toggleNav()">☰</div>

</div>

    <div class="main-container">
     <div class="entry-card">

    <div class="date-row">

        <button class="nav-arrow" id="prevEntry">
            ❮
        </button>

        <div class="date-display" id="entryDate"></div>

        <button class="nav-arrow" id="nextEntry">
            ❯
        </button>

    </div>

    <div class="mood-section">

        <img
            id="currentMood"
            src="{% static 'emojis/happy.png' %}"
            class="main-mood">

        <div>

            <div id="moodName">
                Happy
            </div>

            <div id="entryTime">
                🕒 7:45 PM
            </div>

        </div>

    </div>

    <div class="diary-box">

        <textarea
            id="diaryEntry"
            readonly></textarea>

    </div>

    <div class="section-title">
    📸 Photos
</div>

<input
    type="file"
    id="photoInput"
    accept="image/*"
    multiple
    hidden>

<div class="photo-gallery" id="photoGallery">

    {% for photo in photos %}
    <img class="photo-item" src="{{ photo.url }}">
    {% endfor %}

    <div
        class="photo-add"
        onclick="document.getElementById('photoInput').click()">
        +
    </div>

    </div>

    <div class="section-title">
        🎵 Mood Song
    </div>

    <div class="song-card">

        <img
            src="{% static 'album.png' %}"
            class="album-cover">

        <div class="song-info">

            <div id="songTitle">
                Silence
            </div>

            <div id="songArtist">
                The Paper Kites
            </div>

        </div>

        <button class="play-btn">
            ▶
        </button>

    </div>

    <button
        class="edit-btn"
        id="editButton">
        ✏ Edit Entry
    </button>

   <button
    class="delete-btn"
    onclick="deleteEntry()">
    🗑 Delete Entry
</button>

</div>  
    </div>

    <footer>© 2026 MoodBloom | Mood your day, Bloom your mind.</footer>

document.getElementById("nextEntry")

      document.getElementById("photoInput").addEventListener("change", function () {
    const gallery = document.getElementById("photoGallery");
    const addButton = document.querySelector(".photo-add");

    Array.from(this.files).forEach(file => {
        const reader = new FileReader();

        reader.onload = function (e) {
            const img = document.createElement("img");
            img.src = e.target.result;
            img.className = "photo-item";

            gallery.insertBefore(img, addButton);
        };

        reader.readAsDataURL(file);
    });
});


        let editing = false;

document
.getElementById("editButton")
.addEventListener("click", function(){

    const diary =
    document.getElementById("diaryEntry");

    if(!editing){

        diary.removeAttribute("readonly");

        this.innerHTML =
        "💾 Save Entry";

        editing = true;

    }else{

        updateEntry();

        diary.setAttribute(
            "readonly",
            true
        );

        this.innerHTML =
        "✏ Edit Entry";

        editing = false;
    }

});
        const staticUrl = "/static/emojis/";
        let selectedCategory = "";
        let selectedMoodName = "";

        function toggleNav() { document.getElementById('sideNav').classList.toggle('active'); }
        
        function deleteEntry(){

    if(confirm("Delete this entry?")){

        // fetch delete request
    }

}

        // Logic to update existing entry
        function updateEntry() {
            const entryId = new URLSearchParams(window.location.search).get('id');
          const data = {
    id: entryId,
    category: selectedCategory,
    mood_name: selectedMoodName,
    content: document.getElementById('diaryEntry').value
};
            
            fetch("{% url 'editentry' %}", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
                body: JSON.stringify(data)
            })
            .then(res => res.json())
            .then(result => {
                if(result.status === "success") {
                    alert("Memory updated! 🌸");
                    window.location.href = "{% url 'diaryhistory' %}";
                }
            });
        }

        // INITIALIZE EDIT MODE: Use this to load existing data
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if(params.get('date')) document.getElementById('entryDate').innerText = params.get('date');

</body>
</html>
