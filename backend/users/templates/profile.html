{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght=600&display=swap" rel="stylesheet">
    <style>
        body{
    margin:0;
    font-family:'Segoe UI',Arial,sans-serif;

    background-image:url("{% static 'background_main.png' %}");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    min-height:100vh;
    color:#4a3494;
}
        .profile-card{
    position:fixed;
    top:25px;
    left:25px;

    display:flex;
    align-items:center;
    gap:15px;

    background:rgba(255,255,255,.85);
    padding:12px 20px;

    border-radius:25px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);

    z-index:999;

    text-decoration:none;
    color:#4a3494;
}

.profile-card:hover{
    transform:scale(1.03);
}

.profile-avatar{
    width:55px;
    height:55px;

    border-radius:50%;

    background:#ffe7a6;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:28px;
}

.profile-name{
    font-weight:600;
}

.profile-text{
    font-size:13px;
    color:#7a5fc7;
}

.menu-icon{
    position:fixed;
    top:30px;
    right:30px;

    width:55px;
    height:55px;

    background:white;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;

    box-shadow:0 5px 15px rgba(0,0,0,.08);

    color:#6a4fbf;
    cursor:pointer;

    z-index:999;
}

.side-nav{
    position:fixed;
    top:0;
    right:-300px;
    width:280px;
    height:100%;

    background:rgba(255,255,255,.98);

    box-shadow:-10px 0 30px rgba(0,0,0,.05);

    transition:.4s;

    z-index:1000;

    padding:50px 30px;
    box-sizing:border-box;
}

.side-nav.active{
    right:0;
}

.side-nav a{
    display:block;
    padding:18px 0;
    text-decoration:none;
    font-weight:bold;
    border-bottom:1px solid #f0f0f0;
}

.close-nav{
    font-size:40px;
    cursor:pointer;
    position:absolute;
    top:15px;
    right:25px;
}
.header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 110px; } 
        .title-area { text-align: center; }
        .title-area img { width: 200px; }
        .back-link { font-weight: bold; color: #6a4fbf; text-decoration: none; font-size: 16px; width: 110px; text-align: right; }
        .header-line { border: 0; height: 1px; background: rgba(106, 79, 191, 0.2); margin: 0 40px 20px 40px; }
        .container { max-width: 500px; margin: 20px auto 50px; background: white; padding: 40px; border-radius: 40px; box-shadow: 0 10px 30px rgba(106, 79, 191, 0.1); text-align: center; }
        
        /* 头像容器美化 */
        .avatar-upload-box { position: relative; width: 110px; height: 110px; margin: 0 auto 20px auto; cursor: pointer; }
        .avatar-display { width: 100%; height: 100%; border-radius: 50%; border: 3px solid #b39ddb; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .avatar-display img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-upload-box:hover .avatar-display { border-color: #6a4fbf; transform: scale(1.05); }
        .edit-label { display: block; font-size: 12px; color: #b39ddb; margin-top: 5px; }

        .field { margin-bottom: 18px; text-align: left; }
        label { display: block; color: #6a4fbf; font-weight: bold; margin-bottom: 6px; font-size: 13px; margin-left: 5px; }
        input, select { width: 100%; padding: 12px 15px; border-radius: 15px; border: 1px solid #e8e0ff; background: #fafaff; box-sizing: border-box; color: #4a3494; font-size: 15px; }
        input[type="password"]{letter-spacing:1px;}
        .password-section{margin-top:25px;padding-top:20px;border-top:1px solid #e8e0ff;}
        .btn { width: 100%; padding: 14px; background: #6a4fbf; border: none; border-radius: 25px; color: white; cursor: pointer; font-weight: bold; margin-top: 15px; transition: 0.3s; }
        .btn:hover { background: #5a3ea3; transform: translateY(-2px); }
        .btn-logout { background: none; border: 1px solid #ffb3b3; color: #ff6666; margin-top: 12px; padding: 10px; }
        
        /* 密码 */
        .change-password-link{
            color:#6a4fbf; font-weight:600; cursor:pointer; margin-top:15px; display:inline-block; text-decoration:none;
        }
        .change-password-link:hover{ text-decoration:underline; }
        .password-section{ display:none; margin-top:20px; padding-top:20px; border-top:1px solid #e8e0ff; }
        .password-wrapper{ position:relative; }
        .eye-btn{ position:absolute; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:#888; font-size:18px; }
        .password-overlay{ display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.35); z-index:2000; }
        .password-modal{ display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); width:420px; background:white; padding:30px; border-radius:25px; box-shadow:0 15px 40px rgba(0,0,0,.15); z-index:2001; }
        .password-modal h3{ color:#6a4fbf; margin-top:0; text-align:center; }
        .close-modal{ position:absolute; top:15px; right:20px; font-size:28px; cursor:pointer; color:#999; }

        /* 顶部 Toast 提示框样式 */
        .toast-notification {
            position: fixed;
            top: -100px; /* 默认隐藏在屏幕上方 */
            left: 50%;
            transform: translateX(-50%);
            background: #ffebd6; /* 警告淡黄色 */
            color: #b75c00; /* 警告深橘色文字 */
            border: 1px solid #ffcc99;
            padding: 15px 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            font-weight: 600;
            font-size: 14px;
            z-index: 9999;
            transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 下滑弹跳动画 */
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-notification.show {
            top: 30px; /* 报错时滑下来 */
        }
    </style>
</head>
<body>
    <div id="toastNotification" class="toast-notification">
        ⚠️ <span id="toastMessage">Please enter a valid date!</span>
    </div>
<a href="{% url 'mainpage' %}" class="profile-card">

    <div class="profile-avatar">
        🏠
    </div>

    <div>
        <div class="profile-name">
            Main Page
        </div>

        <div class="profile-text">
            Back to Calendar
        </div>
    </div>

</a>

<div class="title-area" style="text-align:center;padding-top:25px;">
    <img src="{% static 'moodbloom.png' %}">  
</div>

<div class="menu-icon" onclick="toggleNav()">☰</div>

<div class="side-nav" id="sideNav">
    <span class="close-nav" onclick="toggleNav()">&times;</span>

    <div style="margin-top:40px;">

        <a href="{% url 'feedback' %}"
           style="color:#6a4fbf;">
            💬 Feedback
        </a>

        <a href="{% url 'logout' %}"
           style="color:#6a4fbf;">
            🚪 Logout
        </a>

        <a href="{% url 'delete_account' %}"
           style="color:#e57373;">
            🗑 Delete Account
        </a>

    </div>
</div>

<hr class="header-line">
    

    <div class="container">
        <form id="profileForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="avatar-upload-box" onclick="document.getElementById('avatarInput').click()">
                <div class="avatar-display">
                    {% if profile.avatar %}
                        <img id="profilePic" src="{{ profile.avatar.url }}">
                    {% else %}
                        <img id="profilePic" src="{% static 'icons/user-placeholder.png' %}">
                    {% endif %}
                </div>
                <span class="edit-label">Change Photo</span>
            </div>
            <input type="file" id="avatarInput" name="avatar" hidden onchange="previewAvatar(this)" accept="image/*">
            
            <div class="field"><label>Username</label><input type="text" name="username" value="{{ user.username }}" required></div>
            <div class="field"><label>Email Address</label><input type="email" name="email" value="{{ user.email }}" required></div>
            <div class="field"><label>Birthday</label><input type="date" name="birthday" value="{{ profile.birthday|date:'Y-m-d' }}"></div>
            
            <div class="field">
                <label>Gender</label>
                <select name="gender">
                    <option value="Female" {% if profile.gender == "Female" %}selected{% endif %}>Female</option>
                    <option value="Male" {% if profile.gender == "Male" %}selected{% endif %}>Male</option>
                    <option value="Private" {% if profile.gender == "Private" %}selected{% endif %}>Prefer not to say</option>
                </select>
            </div>
            
            <a class="change-password-link" onclick="openPasswordModal()">Change Password</a>
            <button type="submit" class="btn">Save Changes</button>
        </form>

        <form action="{% url 'logout' %}" method="post" style="margin-top: 10px;">
            {% csrf_token %}
            <button type="submit" class="btn btn-logout" onclick="return confirm('Log out?')">Logout</button>
        </form>
    </div>

    <div class="password-overlay" id="passwordOverlay" onclick="closePasswordModal()"></div>
    <div class="password-modal" id="passwordModal">
        <span class="close-modal" onclick="closePasswordModal()">×</span>
        <h3>Change Password</h3>

        <div class="field">
            <label>Current Password</label>
            <div class="password-wrapper">
                <input type="password" id="currentPassword">
                <span class="eye-btn" onclick="togglePassword('currentPassword')">👁️</span>
            </div>
        </div>

        <div class="field">
            <label>New Password</label>
            <div class="password-wrapper">
                <input type="password" id="newPassword">
                <span class="eye-btn" onclick="togglePassword('newPassword')">👁️</span>
            </div>
        </div>

        <div class="field">
            <label>Confirm Password</label>
            <div class="password-wrapper">
                <input type="password" id="confirmPassword">
                <span class="eye-btn" onclick="togglePassword('confirmPassword')">👁</span>
            </div>
        </div>

        <button class="btn" onclick="changePassword()">Save Password</button>
    </div>
    <script>
        function previewAvatar(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) { document.getElementById('profilePic').src = e.target.result; }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function openPasswordModal(){
            document.getElementById('passwordModal').style.display='block';
            document.getElementById('passwordOverlay').style.display='block';
        }

        function closePasswordModal(){
            document.getElementById('passwordModal').style.display='none';
            document.getElementById('passwordOverlay').style.display='none';
        }

        function togglePassword(id){
            const input = document.getElementById(id);
            input.type = (input.type === 'password') ? 'text' : 'password';
        }

        async function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if(newPassword !== confirmPassword){
                alert("Passwords do not match!");
                return;
            }
            
            try{
                const response = await fetch("/change-password/", {
                    method:"POST",
                    headers:{ "Content-Type":"application/json" },
                    body: JSON.stringify({ old_password: currentPassword, new_password: newPassword })
                });
                const data = await response.json();
                if(response.ok){
                    alert(data.message);
                    closePasswordModal();
                    document.getElementById('currentPassword').value = '';
                    document.getElementById('newPassword').value = '';
                    document.getElementById('confirmPassword').value = '';
                } else {
                    alert(data.error);
                }
            } catch(error){
                alert("Something went wrong.");
            }
        }

        // 修正点 2：把独立事件监听搬出来，不再嵌套在密码函数里
        // 1. 初始化限制日历的最大可选范围为今天
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date().toISOString().split('T')[0];
            const birthdayInput = document.querySelector('input[name="birthday"]');
            if (birthdayInput) {
                birthdayInput.max = today;
            }
        });

        // 2. 拦截主表单提交并进行生日逻辑判断
        document.getElementById('profileForm').addEventListener('submit', function(event) {
            const birthdayInput = document.querySelector('input[name="birthday"]');
            
            if (birthdayInput && birthdayInput.value) {
                const selectedDate = birthdayInput.value;
                const today = new Date().toISOString().split('T')[0];
                
                if (selectedDate > today) {
                    event.preventDefault(); // 强行拦截
                    showToast("Please enter a valid date! Birthday cannot be in the future."); // 触发暖调提示框
                }
            }
        });

        // 3. 提示框控制函数
        function showToast(message) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            
            toastMsg.innerText = message;
            toast.classList.add('show'); 
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }
         function toggleNav(){
    document.getElementById('sideNav').classList.toggle('active');
}

    </script>
</body>
</html>
