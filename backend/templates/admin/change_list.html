{% extends "admin/change_list.html" %}
{% load static %}

{% block extrastyle %}
{{ block.super }}
<style>
    /* 1. 彻底美化表格头部 */
    #result_list thead th {
        background-color: #f7f3ff !important;
        color: #7a5fc7 !important;
        border-bottom: 2px solid #b39ddb !important;
    }

    /* 2. 表格行悬停效果 */
    #result_list tbody tr:hover {
        background-color: #ece4ff !important;
    }

    /* 3. 搜索栏和动作栏紫色化 */
    #changelist-search input[type="text"], .actions select {
        border: 1px solid #b39ddb !important;
        border-radius: 8px;
        padding: 5px;
    }

    /* 4. Filter 栏背景色 */
    #changelist-filter {
        background: #faf8ff !important;
        border-left: 1px solid #eee !important;
        padding: 15px;
    }
    
    #changelist-filter h2 {
        color: #7a5fc7 !important;
        text-transform: uppercase;
        font-size: 14px;
    }
</style>
{% endblock %}
