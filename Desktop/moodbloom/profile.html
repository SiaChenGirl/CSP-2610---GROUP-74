{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Profile</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #e8e0ff 100%); min-height: 100vh; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .header-line { border: 0; height: 1px; background: #c5b3e6; margin: 0 40px 30px 40px; }
        .logo img { width: 110px; } .title-img img { width: 230px; }
        .container { max-width: 600px; margin: 30px auto; background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .field { margin-bottom: 20px; }
        label { display: block; color: #6a4fbf; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fafafa; transition: 0.3s; }
        input:focus { border-color: #b39ddb; outline: none; background: white; }
        .btn { width: 100%; padding: 14px; background: #b39ddb; border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.3s; text-align: center; display: block; text-decoration: none;}
        .btn:hover { background: #9a81c7; }
        .btn-del { background: none; border: 1px solid #ffb3b3; color: #ff6666; margin-top: 15px; }
        .messages { color: #2ecc71; text-align: center; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-wrapper">
        <div class="logo"><img src="{% static 'logo.png' %}"></div>
        <div class="title-img"><img src="{% static 'title.png' %}"></div>
        <div class="menu">
            <!-- 修复返回链接 -->
            <a href="{% url 'mainpage' %}" style="text-decoration:none; color:#6a4fbf; font-weight:bold;">Back</a>
        </div>
    </div>
    <hr class="header-line">

    <div class="container">
        <!-- 显示保存成功的提示 -->
        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <div style="width:120px; height:120px; background:#f0f0f0; border-radius:50%; margin: 0 auto 20px; border: 2px solid #e8e0ff; display: flex; align-items:center; justify-content:center; font-size:40px;">👤</div>
        
        <!-- 使用 POST 提交到 Django 后端 -->
        <form method="POST">
            {% csrf_token %}
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" value="{{ profile.user.username }}">
            </div>
            <div class="field">
                <label>Birthday</label>
                <input type="text" name="birthday" value="{{ profile.birthday|default_if_none:'' }}" placeholder="DD / MM / YYYY">
            </div>
            <div class="field">
                <label>Gender</label>
                <input type="text" name="gender" value="{{ profile.gender|default_if_none:'' }}" placeholder="e.g. Female">
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" value="{{ profile.user.email }}">
            </div>

            <button type="submit" class="btn">Save Changes</button>
        </form>
        
        <form action="{% url 'logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-del">Logout</button>
        </form>
    </div>
</body>
</html>
