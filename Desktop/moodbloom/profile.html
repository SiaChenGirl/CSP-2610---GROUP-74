<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-main {
            display: flex;
            justify-content: center;
            padding: 0 60px;
            margin-top: 10px;
        }

        .profile-box {
            background: white;
            border-radius: 40px;
            padding: 40px;
            width: 500px; /* Slimmer box for a better look */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* FIXED AVATAR SIZING */
        .avatar-container {
            position: relative;
            width: 100px; /* Reduced from 130px to 100px */
            height: 100px;
            margin: 0 auto 15px auto;
        }

        .avatar-display {
            width: 100%;
            height: 100%;
            background: #f0ebff;
            border-radius: 50%;
            border: 2px solid #b39ddb;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
            transition: 0.3s;
        }

        .avatar-display:hover {
            border-color: #6a4fbf;
            background: #e8e0ff;
        }

        .avatar-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Form Layout */
        .info-grid {
            text-align: left;
            margin-top: 10px;
        }

        .info-label {
            display: block;
            font-weight: bold;
            color: #6a4fbf;
            margin: 12px 0 4px 5px;
            font-size: 13px;
        }

        .profile-input {
            width: 100%;
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid #e8e0ff;
            background: #fdfbff;
            color: #4a3494;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .save-btn {
            background: #6a4fbf;
            color: white;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-weight: bold;
            margin-top: 25px;
            cursor: pointer;
            transition: 0.3s;
        }
    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="logo"><img src="logo.png"></div>
    <div class="title-area">
        <img src="title.png"><br>
        <span style="color: white; font-style: italic; font-family: 'Dancing Script'; font-size: 18px;">
            Mood your day, Bloom your mind.
        </span>
    </div>
    <div style="font-size:35px; color:rgb(0, 0, 0); cursor:pointer;">☰</div>
</div>

<div class="divider-line"></div>

<div class="profile-main">
    <div class="profile-box">
        <!-- Avatar Change -->
        <label for="avatarInput">
            <div class="avatar-container">
                <div class="avatar-display" id="avatarBox">
                    <img id="profilePic" src="icons/user-placeholder.png" alt="Profile">
                </div>
            </div>
            <input type="file" id="avatarInput" hidden onchange="previewAvatar(this)" accept="image/*">
            <span style="font-size: 11px; color: #b39ddb; cursor: pointer;">Edit Photo</span>
        </label>

        <div class="info-grid">
            <label class="info-label">Your Name</label>
            <input type="text" class="profile-input" placeholder="Enter your name" value="User Name">

            <label class="info-label">Email Address</label>
            <input type="email" class="profile-input" placeholder="example@mail.com">

            <label class="info-label">Birthday</label>
            <input type="date" class="profile-input">

            <label class="info-label">Gender</label>
            <select class="profile-input">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="private">Prefer not to say</option>
            </select>

            <label class="info-label">Bio / Status</label>
            <textarea class="profile-input" style="height: 60px; resize: none;" placeholder="How are you feeling today?"></textarea>
        </div>

        <button class="save-btn">Save Changes</button>
    </div>
</div>

<a href="mainpage.html" class="back-pill">Back</a>

<footer>
    © 2026 MoodBloom | Mood your day, Bloom your mind.
</footer>

<script>
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('profilePic').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
