<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 1. RESTORED GRADIENT & FONT */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #CBB7FF 0%, #E8E0FF 100%);
            min-height: 100vh;
            color: #4a3494;
        }

        /* 2. HEADER (Same as Mainpage) */
        .header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 60px 10px 60px; }
        .logo img { width: 180px; }
        .title-area { text-align: center; margin-top: 10px; }
        .title-area img { width: 230px; margin-bottom: 5px; }
        .slogan { color: white; font-style: italic; font-size: 16px; }
        .menu-btn { font-size: 35px; cursor: pointer; color: white; position: relative; }
        .divider-line { height: 2px; background-color: white; margin: 0 60px 30px 60px; opacity: 0.8; }

        /* 3. LAYOUT (Based on Screenshot 2026-04-30 171938.png) */
        .dashboard-content { display: flex; justify-content: center; align-items: flex-start; gap: 30px; padding: 0 50px; }

        /* Left Card: Percentage */
        .card-left { 
            background: white; border-radius: 40px; padding: 30px; 
            width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;
        }
        .mood-icons { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .mood-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: bold; }
        .mood-dot { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #eee; margin-bottom: 5px; }

        /* Middle Card: Flow */
        .card-middle { 
            background: white; border-radius: 40px; padding: 30px; 
            width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .flow-header { text-align: center; margin-bottom: 20px; }
        .month-selector { 
            border: 2px solid #e8e0ff; padding: 5px 20px; border-radius: 20px; 
            font-family: 'Dancing Script'; font-size: 24px; color: #6a4fbf; font-weight: bold;
        }

        /* 4. UTILITIES */
        .circle-actions { display: flex; flex-direction: column; gap: 20px; }
        .action-btn { 
            width: 65px; height: 65px; background: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; 
        }
        .action-btn img { width: 28px; opacity: 0.7; }
        .active { background: #b39ddb; } /* Highlight the Stats icon */
        .active img { filter: brightness(0) invert(1); opacity: 1; }

        .back-pill { 
            position: fixed; bottom: 30px; right: 50px; 
            background: white; padding: 12px 45px; border-radius: 50px; 
            text-decoration: none; color: #6a4fbf; font-weight: bold; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        .dropdown-content { 
            display: none; position: absolute; right: 0; top: 50px; 
            background: white; min-width: 160px; border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 100; 
        }
        .dropdown-content a { color: #6a4fbf; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; }
        .show { display: block; }
    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="logo"><img src="logo.png"></div>
    <div class="title-area">
        <img src="title.png"><br>
        <span class="slogan">Mood your day, Bloom your mind.</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">☰
        <div id="navDrop" class="dropdown-content">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color:red;">Logout</a>
        </div>
    </div>
</div>

<div class="divider-line"></div>

<div class="dashboard-content">
    <!-- Total Percentage Card -->
    <div class="card-left">
        <p style="font-size: 13px; font-weight: bold; margin-bottom: 20px;">Total percentage of mood record</p>
        <div class="mood-icons">
            <div class="mood-item"><div class="mood-dot" style="background:#FFD700"></div>30%</div>
            <div class="mood-item"><div class="mood-dot" style="background:#C0C0C0"></div>1%</div>
            <div class="mood-item"><div class="mood-dot" style="background:#9370DB"></div>50%</div>
            <div class="mood-item"><div class="mood-dot" style="background:#FF6347"></div>10%</div>
            <div class="mood-item"><div class="mood-dot" style="background:#40E0D0"></div>9%</div>
        </div>
        <canvas id="barChart"></canvas>
    </div>

    <!-- Mood Flow Card -->
    <div class="card-middle">
        <div class="flow-header">
            <span class="month-selector">April 2026 ↕</span>
        </div>
        <h3 style="font-family:'Dancing Script'; margin-top:0;">Mood flow</h3>
        <canvas id="lineChart" height="180"></canvas>
    </div>

    <!-- 4 Circles -->
    <div class="circle-actions">
        <div class="action-btn" onclick="location.href='search.html'"><img src="icons/search.png"></div>
        <div class="action-btn" onclick="location.href='diaryhistory.html'"><img src="icons/book.png"></div>
        <div class="action-btn active" onclick="location.href='dashboard.html'"><img src="icons/stats.png"></div>
        <div class="action-btn" onclick="location.href='gallery.html'"><img src="icons/camera.png"></div>
    </div>
</div>

<a href="mainpage.html" class="back-pill">Back</a>

<script>
    function toggleMenu() { document.getElementById("navDrop").classList.toggle("show"); }

    // BAR CHART
    const ctxBar = document.getElementById('barChart').getContext('2d');
    new Chart(ctxBar, {
        type: 'bar',
        data: {
            labels: ['Happy', 'Neutral', 'Sad', 'Angry', 'Calm'],
            datasets: [{
                data: [30, 1, 50, 10, 9],
                backgroundColor: ['#FFD700','#C0C0C0','#9370DB','#FF6347','#40E0D0'],
                borderRadius: 8
            }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
    });

    // LINE CHART
    const ctxLine = document.getElementById('lineChart').getContext('2d');
    new Chart(ctxLine, {
        type: 'line',
        data: {
            labels: ['1/4', '2/4', '3/4', '4/4', '5/4', '6/4'],
            datasets: [{
                data: [2, 4, 1, 3, 5, 2],
                borderColor: '#6a4fbf',
                backgroundColor: 'rgba(106, 79, 191, 0.1)',
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointBackgroundColor: '#6a4fbf'
            }]
        },
        options: { 
            scales: { 
                y: { min: 1, max: 5, ticks: { stepSize: 1 } },
                x: { grid: { display: false } }
            },
            plugins: { legend: { display: false } }
        }
    });
</script>
</body>
</html>
