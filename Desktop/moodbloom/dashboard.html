<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 1. RESTORED GRADIENT & FONT */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            overflow-x: hidden;
        }

        /* --- NAVIGATION MENU STYLING --- */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-area { text-align: center; }
        .title-area img { width: 230px; }
        
        .menu-icon { 
            font-size: 35px; 
            cursor: pointer; 
            color: #6a4fbf; 
            width: 180px; 
            text-align: right; 
            user-select: none;
        }

        .side-nav {
            position: fixed; 
            top: 0; 
            right: -300px; 
            width: 280px; 
            height: 100%;
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            box-shadow: -10px 0 30px rgba(106, 79, 191, 0.2); 
            z-index: 1000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 50px 30px; 
            box-sizing: border-box;
        }
        
        .side-nav.active { right: 0; }

        .side-nav a {
            display: block; 
            padding: 18px 0; 
            color: #4a3494; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px;
            border-bottom: 1px solid #f0f0f0; 
            transition: 0.3s;
        }
        
        .side-nav a:hover { color: #6a4fbf; padding-left: 15px; }

        .close-nav { 
            font-size: 40px; 
            cursor: pointer; 
            position: absolute; 
            top: 15px; 
            right: 25px; 
            color: #b39ddb; 
        }

        .divider-line { height: 1px; background: rgba(106, 79, 191, 0.2); margin: 0 50px 30px 50px; }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard-content { display: flex; justify-content: center; align-items: flex-start; gap: 30px; padding: 0 50px; }

        .card-left { 
            background: white; border-radius: 40px; padding: 30px; 
            width: 280px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center;
        }
        .mood-icons { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .mood-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; font-weight: bold; }
        .mood-dot { width: 25px; height: 25px; border-radius: 50%; border: 2px solid #eee; margin-bottom: 5px; }

        .card-middle { 
            background: white; border-radius: 40px; padding: 30px; 
            width: 550px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
        }
        .flow-header { text-align: center; margin-bottom: 20px; }
        .month-selector { 
            border: 2px solid #e8e0ff; padding: 5px 20px; border-radius: 20px; 
            font-family: 'Dancing Script'; font-size: 24px; color: #6a4fbf; font-weight: bold;
        }

        .circle-actions { display: flex; flex-direction: column; gap: 20px; }
        .action-btn { 
            width: 65px; height: 65px; background: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; 
            transition: 0.3s;
        }
        .action-btn:hover { transform: scale(1.1); }
        .action-btn img { width: 28px; opacity: 0.7; }
        .active { background: #b39ddb; } 
        .active img { filter: brightness(0) invert(1); opacity: 1; }

        footer { text-align: center; padding: 40px 0; color: #6a4fbf; font-weight: bold; }
    </style>
</head>
<body>

    <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top: 40px;">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color: #e57373; margin-top: 50px; border: none;">Logout</a>
        </div>
    </div>

    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-area">
            <img src="title.png"><br>
            <span style="color:#6a4fbf; font-style:italic; font-size: 14px;">Mood your day, Bloom your mind.</span>
        </div>
        <div class="menu-icon" onclick="toggleNav()">☰</div>
    </div>

    <div class="divider-line"></div>

    <div class="dashboard-content">
        <div class="card-left">
            <p style="font-size: 13px; font-weight: bold; margin-bottom: 20px;">Total percentage of mood record</p>
            <div class="mood-icons">
                <div class="mood-item"><div class="mood-dot" style="background:#FFD700"></div>30%</div>
                <div class="mood-item"><div class="mood-dot" style="background:#C0C0C0"></div>1%</div>
                <div class="mood-item"><div class="mood-dot" style="background:#9370DB"></div>50%</div>
                <div class="mood-item"><div class="mood-dot" style="background:#FF6347"></div>10%</div>
                <div class="mood-item"><div class="mood-dot" style="background:#40E0D0"></div>9%</div>
            </div>
            <canvas id="barChart"></canvas>
        </div>

        <div class="card-middle">
            <div class="flow-header">
                <span class="month-selector">May 2026 ↕</span>
            </div>
            <h3 style="font-family:'Dancing Script'; margin-top:0; font-size: 32px; color: #6a4fbf;">Mood flow</h3>
            <canvas id="lineChart" height="180"></canvas>
        </div>

        <div class="circle-actions">
            <div class="action-btn" title="Search" onclick="location.href='search.html'"><img src="icons/search.png"></div>
            <div class="action-btn" title="History" onclick="location.href='article.html'"><img src="icons/book.png"></div>
            <div class="action-btn active" title="Stats" onclick="location.href='dashboard.html'"><img src="icons/stats.png"></div>
            <div class="action-btn" title="Gallery" onclick="location.href='gallery.html'"><img src="icons/camera.png"></div>
        </div>
    </div>

    <footer>© 2026 MoodBloom | Mood your day, Bloom your mind.</footer>

    <script>
        function toggleNav() {
            document.getElementById('sideNav').classList.toggle('active');
        }

        // BAR CHART
        const ctxBar = document.getElementById('barChart').getContext('2d');
        new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['Happy', 'Neutral', 'Sad', 'Angry', 'Calm'],
                datasets: [{
                    data: [30, 1, 50, 10, 9],
                    backgroundColor: ['#FFD700','#C0C0C0','#9370DB','#FF6347','#40E0D0'],
                    borderRadius: 8
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
        });

        // LINE CHART
        const ctxLine = document.getElementById('lineChart').getContext('2d');
        new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: ['5/5', '6/5', '7/5', '8/5', '9/5', '10/5'],
                datasets: [{
                    data: [4, 5, 3, 4, 5, 5],
                    borderColor: '#6a4fbf',
                    backgroundColor: 'rgba(106, 79, 191, 0.1)',
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: '#6a4fbf'
                }]
            },
            options: { 
                scales: { 
                    y: { min: 1, max: 5, ticks: { stepSize: 1 } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });
    </script>
</body>
</html>
