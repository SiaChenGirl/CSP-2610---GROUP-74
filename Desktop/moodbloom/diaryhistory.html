<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Previous Diaries</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #e8e0ff 100%); 
            min-height: 100vh; 
            color: #4a3494; 
        }

        /* --- HEADER --- */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .header-line { border: 0; height: 1px; background: #c5b3e6; margin: 0 40px 20px 40px; opacity: 0.6; }
        
        .logo img { width: 180px; } /* Your Large Logo */
        .title-img img { width: 230px; }
        
        .back-nav { width: 180px; text-align: right; }
        .back-btn { 
            text-decoration: none; 
            color: #6a4fbf; 
            font-weight: bold; 
            border: 1px solid #6a4fbf; 
            padding: 10px 20px; 
            border-radius: 25px; 
            transition: 0.3s;
        }
        .back-btn:hover { background: #6a4fbf; color: white; }

        .container { max-width: 800px; margin: 0 auto; padding: 20px; }

        /* --- SEARCH/PICKER SECTION --- */
        .history-controls { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            margin-bottom: 30px; 
            background: rgba(255, 255, 255, 0.5); 
            padding: 15px 25px; 
            border-radius: 50px;
        }
        select { 
            flex: 1; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid #c5b3e6; 
            color: #6a4fbf; 
            font-weight: bold; 
            outline: none; 
            cursor: pointer;
        }

        /* --- DIARY DISPLAY CARD --- */
        .diary-card { 
            background: white; 
            border-radius: 30px; 
            padding: 40px; 
            box-shadow: 0 10px 25px rgba(106, 79, 191, 0.1); 
            min-height: 450px; 
            position: relative; 
            transition: 0.5s;
        }
        
        .diary-date { font-size: 14px; color: #aaa; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .diary-title { 
            font-family: 'Dancing Script', cursive; 
            font-size: 42px; 
            color: #6a4fbf; 
            margin: 0 0 25px 0; 
            border-bottom: 1px solid #f8f6ff; 
            padding-bottom: 10px; 
        }

        .mood-summary { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            background: #f8f6ff; 
            padding: 15px; 
            border-radius: 20px; 
            margin-bottom: 30px; 
            width: fit-content;
        }
        .mood-summary img { width: 50px; height: auto; }
        .mood-info b { color: #6a4fbf; }

        .diary-content { 
            font-size: 19px; 
            line-height: 1.8; 
            color: #555; 
            white-space: pre-line; /* Keeps your paragraph breaks */
        }

        /* --- EMPTY STATE --- */
        .empty-state { 
            text-align: center; 
            padding: 80px 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .empty-state img { width: 100px; opacity: 0.2; margin-bottom: 20px; }
        .empty-state h3 { color: #b39ddb; font-size: 20px; margin-bottom: 25px; }
        .btn-create { 
            background: #b39ddb; 
            color: white; 
            padding: 15px 40px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            box-shadow: 0 5px 15px rgba(179, 157, 219, 0.4);
            transition: 0.3s;
        }
        .btn-create:hover { background: #9a81c7; transform: translateY(-3px); }

        /* --- EDIT BUTTON --- */
        .edit-btn { 
            position: absolute; 
            bottom: 30px; 
            right: 30px; 
            background: #6a4fbf; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        .edit-btn:hover { background: #4a3494; }

    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-img"><img src="title.png"></div>
        <div class="back-nav"><a href="mainpage.html" class="back-btn">Back</a></div>
    </div>
    <hr class="header-line">

    <div class="container">
        <div class="history-controls">
            <span style="font-weight:bold;">Select Entry:</span>
            <select id="diarySelector" onchange="displayDiary()">
                <option value="2026-04-30">Today (April 30, 2026)</option>
                <option value="2026-04-29">April 29, 2026</option>
                <option value="2026-04-28">April 28, 2026</option>
                <option value="2026-04-27">April 27, 2026</option>
            </select>
        </div>

        <div class="diary-card" id="displayArea">
            </div>
    </div>

    <script>
        // 1. DATA: This simulates diaries you have already saved.
        // In your presentation, you can click "April 28" to show a filled one.
        const mySavedDiaries = {
            "2026-04-28": {
                moodImg: "emojis/happy.png",
                moodName: "Happy",
                intensity: "5",
                text: "Today was amazing! My group and I finished the MoodBloom design. I feel so relieved and happy that the project is coming together. The lavender theme looks really pretty."
            },
            "2026-04-29": {
                moodImg: "emojis/tired.png",
                moodName: "Tired",
                intensity: "4",
                text: "Stayed up late working on the code logic. I'm exhausted but proud of the progress. Hopefully I can sleep early tonight!"
            }
            // Note: April 30 and 27 are empty to show the "Empty State"
        };

        // 2. FUNCTION: Displays the diary based on the chosen date
        function displayDiary() {
            const dateKey = document.getElementById('diarySelector').value;
            const readableDate = document.getElementById('diarySelector').options[document.getElementById('diarySelector').selectedIndex].text;
            const area = document.getElementById('displayArea');
            
            const diary = mySavedDiaries[dateKey];

            if (diary) {
                // SHOW SAVED ENTRY
                area.innerHTML = `
                    <div class="diary-date">${readableDate}</div>
                    <h2 class="diary-title">My Bloom Memories</h2>
                    
                    <div class="mood-summary">
                        <img src="${diary.moodImg}">
                        <div class="mood-info">
                            Felt <b>${diary.moodName}</b><br>
                            <small>Intensity: ${diary.intensity}/5</small>
                        </div>
                    </div>

                    <div class="diary-content">${diary.text}</div>
                    
                    <button class="edit-btn" onclick="location.href='moodentry.html'">Edit Entry</button>
                `;
            } else {
                // SHOW EMPTY STATE
                area.innerHTML = `
                    <div class="empty-state">
                        <img src="emojis/neutral.png">
                        <h3>No memories bloomed on this day yet.</h3>
                        <p style="color:#aaa; margin-bottom:20px;">Would you like to write something down?</p>
                        <a href="moodentry.html" class="btn-create">Create Entry Now</a>
                    </div>
                `;
            }
        }

        // Initial load
        window.onload = displayDiary;
    </script>
</body>
</html>
