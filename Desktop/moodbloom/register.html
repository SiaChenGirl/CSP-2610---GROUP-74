<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. LAYOUT & GRADIENT */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            display: flex;
            flex-direction: column;
        }

        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-area img { width: 253px; }
        
        /* Removed navigation menu-icon style */

        .content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        
        .box { 
            width: 400px; 
            background: rgba(255, 255, 255, 0.6); 
            backdrop-filter: blur(12px);
            padding: 40px; 
            border-radius: 30px; 
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center; 
            box-shadow: 0 8px 25px rgba(106, 79, 191, 0.1); 
        }

        .input-group { position: relative; width: 100%; margin: 15px 0; }
        
        input { 
            width: 100%; padding: 14px 15px; border-radius: 15px; 
            border: 1px solid #e0d7ff; 
            background: white; box-sizing: border-box; outline: none;
            color: #4a3494;
            font-size: 15px;
        }

        .verify-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%); 
            background: #6a4fbf;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        
        .verify-btn:hover { background: #4a3494; }

        .password-separator { margin-top: 12px; }

        .btn-main { 
            width: 100%; padding: 15px; background: #6a4fbf; 
            border: none; border-radius: 15px; color: white; 
            font-weight: bold; font-size: 16px; cursor: pointer; 
            margin-top: 25px; transition: 0.3s;
        }
        .btn-main:hover { background: #4a3494; transform: scale(1.02); }

        footer { text-align: center; padding: 20px; color: #6a4fbf; font-weight: bold; opacity: 0.8; }
    </style>
</head>
<body>

    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-area">
            <img src="title.png"><br>
            <span style="color: #6a4fbf; font-style: italic; font-size: 14px;">Mood your day, Bloom your mind.</span>
        </div>
        <div style="width: 180px;"></div>
    </div>

    <div class="divider-line" style="height:1px; background:rgba(106, 79, 191, 0.2); margin:0 50px;"></div>

    <div class="content">
        <div class="box">
            <h2 style="color: #6a4fbf; margin-bottom: 25px;">Create Account</h2>
            
            <div class="input-group">
                <input type="text" placeholder="Username">
            </div>

            <div class="input-group">
                <input type="email" id="userEmail" placeholder="Email Address">
                <button type="button" class="verify-btn" onclick="triggerVerify()">Verify</button>
            </div>

            <div class="input-group password-separator">
                <input type="password" placeholder="Password">
            </div>
            <div class="input-group password-separator">
                <input type="password" placeholder="Confirm Password">
            </div>

            <button class="btn-main" onclick="location.href='login.html'">Sign Up</button>
            
            <p style="font-size: 13px; margin-top: 20px; color: #6a4fbf;">
                Already have an account? <a href="login.html" style="color: #4a3494; font-weight: bold; text-decoration: none;">Login</a>
            </p>
        </div>
    </div>

    <footer>
        © 2026 MoodBloom | Mood your day, Bloom your mind.
    </footer>

    <script>
        function triggerVerify() {
            const email = document.getElementById('userEmail').value;
            if(!email) {
                alert("Please enter an email address first!");
                return;
            }
            alert("Verification request sent for: " + email);
        }
    </script>
</body>
</html>
