<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Search Memories</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. LAYOUT & GRADIENT */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            overflow-x: hidden;
        }

        /* --- NAVIGATION MENU STYLING --- */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-area img { width: 253px; }
        
        .menu-icon { 
            font-size: 35px; 
            cursor: pointer; 
            color: #6a4fbf; 
            width: 180px; 
            text-align: right; 
            user-select: none;
        }

        /* Side Navigation Drawer */
        .side-nav {
            position: fixed; 
            top: 0; 
            right: -300px; 
            width: 280px; 
            height: 100%;
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            box-shadow: -10px 0 30px rgba(106, 79, 191, 0.2); 
            z-index: 1000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 50px 30px; 
            box-sizing: border-box;
        }
        
        .side-nav.active { right: 0; }

        .side-nav a {
            display: block; 
            padding: 18px 0; 
            color: #4a3494; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px;
            border-bottom: 1px solid #f0f0f0; 
            transition: 0.3s;
        }
        
        .side-nav a:hover { color: #6a4fbf; padding-left: 15px; }

        .close-nav { 
            font-size: 40px; 
            cursor: pointer; 
            position: absolute; 
            top: 15px; 
            right: 25px; 
            color: #b39ddb; 
        }

        /* --- SEARCH CONTENT --- */
        .search-main { display: flex; justify-content: center; gap: 40px; padding: 40px 60px; }
        .filter-section { display: flex; flex-direction: column; gap: 20px; width: 180px; }
        
        .filter-pill { 
            background: white; padding: 12px 35px; border-radius: 30px; 
            font-weight: bold; color: #6a4fbf; cursor: pointer; text-align: center;
            box-shadow: 0 4px 10px rgba(106, 79, 191, 0.1); 
        }

        .results-container { 
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); 
            border-radius: 40px; padding: 35px; 
            width: 700px; min-height: 480px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 1px solid white;
            text-align: center;
        }

        .inline-tool { display: none; margin-bottom: 30px; animation: fadeIn 0.4s; }
        .calendar-input { padding: 15px; border-radius: 20px; border: 2px solid #e8e0ff; color: #4a3494; font-weight: bold; outline: none; }
        .keyword-input { width: 100%; padding: 15px 25px; border-radius: 50px; border: 2px solid #e8e0ff; outline: none; font-size: 16px; box-sizing: border-box; color: #4a3494; }

        .mood-options { display: none; justify-content: space-around; margin-top: 20px; }
        .mood-options img { width: 80px; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        footer { text-align: center; padding: 30px; color: #6a4fbf; font-weight: bold; }
    </style>
</head>
<body>

    <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top: 40px;">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color: #e57373; margin-top: 50px; border: none;">Logout</a>
        </div>
    </div>

    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-area">
            <img src="title.png"><br>
            <span style="color:#6a4fbf; font-style:italic;">Mood your day, Bloom your mind.</span>
        </div>
        <div class="menu-icon" onclick="toggleNav()">☰</div>
    </div>
    
    <div class="divider-line" style="height:1px; background:rgba(106, 79, 191, 0.2); margin:0 50px;"></div>

    <div class="search-main">
        <div class="filter-section">
            <div class="filter-pill" onclick="showCalendar()">Date</div>
            <div class="filter-pill" onclick="showMoods()">Mood</div>
            <div class="filter-pill" onclick="showKeyword()">Keyword</div>
        </div>

        <div class="results-container" id="searchContent">
            
            <div class="inline-tool" id="calendarBox">
                <h3 style="color:#6a4fbf;">Pick a Date</h3>
                <input type="date" class="calendar-input" onchange="searchByDate(this.value)">
            </div>

            <div class="inline-tool" id="keywordBox">
                <input type="text" class="keyword-input" placeholder="Search Previous Entry By Keyword.~" onkeyup="searchKeyword(this.value)">
            </div>

            <div class="mood-options" id="moodGrid">
                <img src="happy.png" onclick="filterByMood('Happy')">
                <img src="sad.png" onclick="filterByMood('Sad')">
                <img src="neutral.png" onclick="filterByMood('Neutral')">
                <img src="angry.png" onclick="filterByMood('Angry')">
            </div>

            <div id="defaultMsg" style="color:#b39ddb; margin-top:100px; font-size: 18px;">
                Select a filter to search your memories.
            </div>
            
            <div id="resultsList" style="margin-top:20px; text-align: left;"></div>
        </div>
    </div>

    <footer>© 2026 MoodBloom | Mood your day, Bloom your mind.</footer>

    <script>
        function toggleNav() {
            var nav = document.getElementById('sideNav');
            nav.classList.toggle('active');
        }

        function resetDisplay() {
            document.getElementById('defaultMsg').style.display = 'none';
            document.getElementById('moodGrid').style.display = 'none';
            document.getElementById('calendarBox').style.display = 'none';
            document.getElementById('keywordBox').style.display = 'none';
            document.getElementById('resultsList').innerHTML = '';
        }

        function showCalendar() { resetDisplay(); document.getElementById('calendarBox').style.display = 'block'; }
        function showMoods() { resetDisplay(); document.getElementById('moodGrid').style.display = 'flex'; }
        function showKeyword() { resetDisplay(); document.getElementById('keywordBox').style.display = 'block'; }

        function searchByDate(val) { document.getElementById('resultsList').innerHTML = `<p style="text-align:center;">Results for ${val}: <b>None found.</b></p>`; }
        function filterByMood(mood) { document.getElementById('resultsList').innerHTML = `<h3>${mood} Memories</h3><p>Entry found: "It was a ${mood} day."</p>`; }
        function searchKeyword(val) { if(val.length > 2) document.getElementById('resultsList').innerHTML = `<p>Results for "${val}"...</p>`; }
    </script>
</body>
</html>
