<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Mood Entry</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <style>
        /* 1. GRADIENT & GLOBAL SETUP */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(180deg, #FFFFFF 0%, #F5F2FF 40%, #DED4FF 100%);
            background-attachment: fixed; 
            min-height: 100vh; 
            color: #4a3494;
            overflow-x: hidden;
        }

        /* --- NAVIGATION MENU STYLING (MATCHES SEARCH PAGE) --- */
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .logo img { width: 180px; }
        .title-img img { width: 253px; }
        
        .menu-icon { 
            font-size: 35px; 
            cursor: pointer; 
            color: #6a4fbf; 
            width: 180px; 
            text-align: right; 
            user-select: none;
        }

        /* Side Navigation Drawer */
        .side-nav {
            position: fixed; 
            top: 0; 
            right: -300px; 
            width: 280px; 
            height: 100%;
            background: rgba(255, 255, 255, 0.98); 
            backdrop-filter: blur(10px);
            box-shadow: -10px 0 30px rgba(106, 79, 191, 0.2); 
            z-index: 1000;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 50px 30px; 
            box-sizing: border-box;
        }
        
        .side-nav.active { right: 0; }

        .side-nav a {
            display: block; 
            padding: 18px 0; 
            color: #4a3494; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 18px;
            border-bottom: 1px solid #f0f0f0; 
            transition: 0.3s;
        }
        
        .side-nav a:hover { color: #6a4fbf; padding-left: 15px; }

        .close-nav { 
            font-size: 40px; 
            cursor: pointer; 
            position: absolute; 
            top: 15px; 
            right: 25px; 
            color: #b39ddb; 
        }

        /* THE LINE (Divider) */
        .header-line { 
            border: 0; 
            height: 1px; 
            background: rgba(106, 79, 191, 0.2); 
            margin: 0 50px 20px 50px; 
        }

        /* --- CONTENT --- */
        .main-container { display: flex; max-width: 1100px; margin: 0 auto; padding: 20px; gap: 30px; }
        .box { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border-radius: 30px; padding: 25px; box-shadow: 0 10px 25px rgba(106, 79, 191, 0.1); margin-bottom: 20px; border: 1px solid white; }
        
        .diary-section { flex: 2; display: flex; flex-direction: column; min-height: 550px; }
        .diary-section h2 { font-family: 'Dancing Script', cursive; font-size: 42px; margin: 0; color: #6a4fbf; }
        textarea { flex: 1; border: none; outline: none; font-size: 18px; line-height: 1.6; resize: none; background: transparent; padding-top: 15px; color: #555; }

        /* Emotion Hub Drawer */
        .emotion-hubs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .hub-item { cursor: pointer; opacity: 0.4; transition: 0.3s; text-align: center; }
        .hub-item img { width: 55px; display: block; margin: 0 auto; }
        .hub-item.active { opacity: 1; transform: scale(1.1); }
        .emotion-drawer { display: none; background: #f8f6ff; padding: 15px; border-radius: 20px; margin: 15px 0; }
        .emotion-drawer.open { display: block; }

        /* Music Search */
        .search-container { position: relative; }
        .song-search { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #eee; background: white; outline: none; box-sizing: border-box; }
        .song-results { position: absolute; top: 45px; left: 0; width: 100%; background: white; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-height: 120px; overflow-y: auto; display: none; z-index: 10; }
        .song-results div { padding: 10px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #f9f9f9; }

        /* Photo Slots */
        .photo-slots { display: flex; gap: 10px; }
        .slot { flex: 1; aspect-ratio: 1/1; border: 2px dashed #e8e0ff; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; background: white; color: #b39ddb; }

        /* Photo Modal Overlay */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-card { background: white; padding: 30px; border-radius: 30px; text-align: center; width: 300px; }
        
        .save-btn { display: block; margin: 20px auto 50px; padding: 15px 80px; background: #6a4fbf; color: white; border: none; border-radius: 50px; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .save-btn:hover { background: #4a3494; transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="side-nav" id="sideNav">
        <span class="close-nav" onclick="toggleNav()">&times;</span>
        <div style="margin-top: 40px;">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color: #e57373; margin-top: 50px; border: none;">Logout</a>
        </div>
    </div>

    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-img"><img src="title.png"></div>
        <div class="menu-icon" onclick="toggleNav()">☰</div>
    </div>

    <div class="header-line"></div>

    <div class="main-container">
        <div class="box diary-section">
            <div style="font-size: 14px; color: #aaa;">May 10, 2026</div>
            <h2>My Daily Bloom</h2>
            <div id="moodMessage" style="font-style: italic; color: #9a81c7; margin: 10px 0;">Select an emotion to start...</div>
            <textarea placeholder="Write your thoughts here..."></textarea>
        </div>

        <div class="tools-section" style="flex: 1;">
            <div class="box">
                <h3>Emotion Hub</h3>
                <div class="emotion-hubs">
                    <div class="hub-item" onclick="openDrawer('sad', this)"><img src="emojis/sad.png"></div>
                    <div class="hub-item" onclick="openDrawer('neutral', this)"><img src="emojis/neutral.png"></div>
                    <div class="hub-item" onclick="openDrawer('happy', this)"><img src="emojis/happy.png"></div>
                    <div class="hub-item" onclick="openDrawer('angry', this)"><img src="emojis/angry.png"></div>
                </div>
                <div class="emotion-drawer" id="moodDrawer">
                    <div id="drawerContent" style="display:grid; grid-template-columns:repeat(4,1fr); gap:10px;"></div>
                </div>
                <h3 style="margin-top:15px;">Intensity</h3>
                <input type="range" min="1" max="5" value="3" style="width:100%; accent-color:#6a4fbf;">
            </div>

            <div class="box">
                <h3>Memories</h3>
                <div class="photo-slots">
                    <div class="slot" onclick="openPhotoModal()">+</div>
                    <div class="slot"></div><div class="slot"></div>
                </div>
            </div>

            <div class="box">
                <h3>Mood Song 🎧</h3>
                <div class="search-container">
                    <input type="text" class="song-search" id="songInput" placeholder="Artist or Song..." onkeyup="filterSongs()">
                    <div class="song-results" id="results">
                        <div onclick="selectSong('Espresso - Sabrina Carpenter')">Espresso - Sabrina Carpenter</div>
                        <div onclick="selectSong('Cruel Summer - Taylor Swift')">Cruel Summer - Taylor Swift</div>
                        <div onclick="selectSong('Yellow - Coldplay')">Yellow - Coldplay</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button class="save-btn" onclick="saveEntry()">Save Entry</button>

    <div class="modal-overlay" id="photoModal" onclick="closePhotoModal(event)">
        <div class="modal-card">
            <h3 style="margin-top:0; color:#6a4fbf;">ADD PHOTO</h3>
            <div style="display:flex; justify-content:space-around; margin-top:20px;">
                <label style="cursor:pointer; display:flex; flex-direction:column; align-items:center;">
                    <span style="font-size:35px;">📷</span>
                    <span style="font-size:11px; font-weight:bold;">TAKE PHOTO</span>
                    <input type="file" accept="image/*" capture="environment" style="display:none">
                </label>
                <label style="cursor:pointer; display:flex; flex-direction:column; align-items:center;">
                    <span style="font-size:35px;">📁</span>
                    <span style="font-size:11px; font-weight:bold;">UPLOAD FILES</span>
                    <input type="file" accept="image/*" style="display:none">
                </label>
            </div>
        </div>
    </div>

    <script>
        function toggleNav() { 
            var nav = document.getElementById('sideNav');
            nav.classList.toggle('active'); 
        }
        
        const pngMap = {
            'happy': [{f:'happy.png', n:'Happy'}, {f:'kiss.png', n:'Loved'}],
            'neutral': [{f:'neutral.png', n:'Calm'}, {f:'shy.png', n:'Shy'}],
            'sad': [{f:'sad.png', n:'Sad'}],
            'angry': [{f:'angry.png', n:'Angry'}]
        };

        function openDrawer(category, element) {
            document.querySelectorAll('.hub-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
            const drawer = document.getElementById('moodDrawer');
            const content = document.getElementById('drawerContent');
            drawer.classList.add('open');
            content.innerHTML = ''; 
            pngMap[category].forEach(item => {
                let div = document.createElement('div');
                div.style.cursor = 'pointer';
                div.innerHTML = `<img src="emojis/${item.f}" style="width:45px;"><br><span style="font-size:10px;">${item.n}</span>`;
                div.onclick = () => document.getElementById('moodMessage').innerText = `I feel ${item.n} today.`;
                content.appendChild(div);
            });
        }

        function filterSongs() {
            let input = document.getElementById('songInput').value.toLowerCase();
            document.getElementById('results').style.display = input ? 'block' : 'none';
        }
        function selectSong(name) {
            document.getElementById('songInput').value = name;
            document.getElementById('results').style.display = 'none';
        }

        function openPhotoModal() { document.getElementById('photoModal').style.display = 'flex'; }
        function closePhotoModal(e) { if(e.target.id === 'photoModal') e.target.style.display = 'none'; }
        function saveEntry() { alert('Mood Bloomed! 🌸'); location.href='mainpage.html'; }
    </script>
</body>
</html>
