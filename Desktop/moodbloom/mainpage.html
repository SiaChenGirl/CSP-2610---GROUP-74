<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Main Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        /* 1. GRADIENT BACKGROUND (渐变浅紫色) */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #CBB7FF 0%, #E8E0FF 100%);
            min-height: 100vh;
            color: #4a3494;
        }
        
        /* 2. HEADER & LOGO */
        .header-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-start; 
            padding: 30px 60px 10px 60px; 
        }
        .logo img { width: 180px; }
        
        .title-area { text-align: center; margin-top: 10px; }
        .title-area img { width: 230px; margin-bottom: 5px; }
        .slogan { 
            color: white; 
            font-style: italic; 
            font-size: 16px; 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .menu-btn { font-size: 35px; cursor: pointer; color: white; position: relative; }

        /* THE LINE (Restored) */
        .divider-line {
            height: 2px;
            background-color: white;
            margin: 0 60px 40px 60px;
            opacity: 0.8;
        }

        /* 3. CALENDAR BOX */
        .main-content { 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            gap: 40px; 
            padding-bottom: 50px;
        }

        .calendar-container { 
            background: white; 
            padding: 40px; 
            border-radius: 40px; 
            width: 750px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .cal-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 30px; 
        }
        .cal-header select { 
            border: none; 
            font-family: 'Dancing Script'; 
            font-size: 32px; 
            color: #6a4fbf; 
            font-weight: bold; 
            cursor: pointer; 
            outline: none;
            background: transparent;
        }
        
        .grid-layout { display: grid; grid-template-columns: repeat(7, 1fr); gap: 20px; text-align: center; }
        .day-label { font-weight: bold; color: #b39ddb; font-size: 14px; }
        
        .date-circle { 
            width: 55px; 
            height: 55px; 
            line-height: 55px; 
            border-radius: 50%; 
            background: #f8f6ff; 
            cursor: pointer; 
            transition: 0.3s;
            font-size: 18px;
        }
        .date-circle:hover { background: #6a4fbf; color: white; transform: scale(1.1); }

        /* 4. THE 4 CIRCLES */
        .circle-actions { display: flex; flex-direction: column; gap: 25px; }
        .action-btn { 
            width: 70px; 
            height: 70px; 
            background: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: 0.3s;
        }
        .action-btn:hover { transform: scale(1.1); background: #f0ebff; }
        .action-btn img { width: 32px; opacity: 0.7; }

        /* Dropdown */
        .dropdown-content { 
            display: none; position: absolute; right: 0; top: 50px; 
            background: white; min-width: 160px; border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 100; 
        }
        .dropdown-content a { color: #6a4fbf; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; font-size: 14px; }
        .show { display: block; }
    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="logo"><img src="logo.png"></div>
    <div class="title-area">
        <img src="title.png"><br>
        <span class="slogan">Mood your day, Bloom your mind.</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">☰
        <div id="navDrop" class="dropdown-content">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color:red;">Logout</a>
        </div>
    </div>
</div>

<!-- RESTORED LINE -->
<div class="divider-line"></div>

<div class="main-content">
    <div class="calendar-container">
        <div class="cal-header">
            <select id="mSelect" onchange="buildCal()"></select>
            <select id="ySelect" onchange="buildCal()"></select>
        </div>
        <div class="grid-layout" id="calDisplay"></div>
    </div>

    <!-- THE 4 CIRCLES -->
    <div class="circle-actions">
        <div class="action-btn" title="Search" onclick="location.href='search.html'"><img src="icons/search.png"></div>
        <div class="action-btn" title="History" onclick="location.href='article.html'"><img src="icons/book.png"></div>
        <div class="action-btn" title="Dashboard" onclick="location.href='dashboard.html'"><img src="icons/stats.png"></div>
        <div class="action-btn" title="Gallery" onclick="location.href='gallery.html'"><img src="icons/camera.png"></div>
    </div>
</div>

<script>
    const mNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    
    function startup() {
        const ms = document.getElementById('mSelect');
        const ys = document.getElementById('ySelect');
        mNames.forEach((n, i) => ms.innerHTML += `<option value="${i}">${n}</option>`);
        for(let y=2024; y<=2027; y++) ys.innerHTML += `<option value="${y}">${y}</option>`;
        
        ms.value = 3; // April
        ys.value = 2026;
        buildCal();
    }

    function buildCal() {
        const display = document.getElementById('calDisplay');
        display.innerHTML = '';
        const m = parseInt(document.getElementById('mSelect').value);
        const y = parseInt(document.getElementById('ySelect').value);
        
        ["S","M","T","W","T","F","S"].forEach(d => display.innerHTML += `<div class="day-label">${d}</div>`);
        
        const first = new Date(y, m, 1).getDay();
        const total = new Date(y, m + 1, 0).getDate();

        for(let i=0; i<first; i++) display.innerHTML += `<div></div>`;
        for(let d=1; d<=total; d++) {
            display.innerHTML += `<div class="date-circle" onclick="location.href='moodentry.html'">${d}</div>`;
        }
    }

    function toggleMenu() { document.getElementById("navDrop").classList.toggle("show"); }
    window.onclick = function(e) { 
        if (!e.target.matches('.menu-btn')) {
            const d = document.getElementById("navDrop");
            if (d && d.classList.contains('show')) d.classList.remove('show');
        }
    }
    startup();
</script>
</body>
</html>
