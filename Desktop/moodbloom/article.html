<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Articles</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
    <style>
        /* 1. BRANDING & BACKGROUND */
        body { 
            margin: 0; 
            font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #CBB7FF 0%, #E8E0FF 100%);
            min-height: 100vh; 
            color: #4a3494;
        }

        /* 2. HEADER & LINE */
        .header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 60px 10px 60px; }
        .logo img { width: 180px; }
        .title-area { text-align: center; margin-top: 10px; }
        .title-area img { width: 230px; margin-bottom: 5px; }
        .slogan { color: white; font-style: italic; font-size: 16px; }
        .menu-btn { font-size: 35px; cursor: pointer; color: white; position: relative; }
        .divider-line { height: 2px; background-color: white; margin: 0 60px 30px 60px; opacity: 0.8; }

        /* 3. ARTICLE LAYOUT (Grid Left, Reader Right) */
        .article-main { 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            gap: 30px; 
            padding: 0 50px 50px 50px; 
        }

        /* Left: Article Selection Grid */
        .article-list-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 400px;
        }
        .article-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .article-card:hover { transform: translateY(-5px); background: #f8f6ff; }
        .article-thumb { 
            width: 100%; 
            aspect-ratio: 1.2; 
            background: #e8e0ff; 
            border-radius: 15px; 
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .article-card h4 { margin: 5px 0; font-size: 14px; color: #6a4fbf; }

        /* Right: Main Reading View */
        .reader-view { 
            background: white; 
            border-radius: 40px; 
            padding: 40px; 
            flex-grow: 1; 
            max-width: 700px;
            min-height: 550px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .reader-view h2 { font-family: 'Dancing Script'; font-size: 32px; color: #6a4fbf; margin-top: 0; }
        .reader-content { 
            line-height: 1.8; 
            color: #555; 
            font-size: 16px;
            text-align: justify;
        }

        /* 4. UTILITIES (4 Circles) */
        .circle-actions { display: flex; flex-direction: column; gap: 20px; }
        .action-btn { 
            width: 65px; height: 65px; background: white; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; 
        }
        .action-btn img { width: 28px; opacity: 0.7; }
        .action-btn:hover { background: #f0ebff; }

        /* BACK PILL */
        .back-pill { 
            position: fixed; bottom: 30px; right: 50px; 
            background: white; padding: 12px 45px; border-radius: 50px; 
            text-decoration: none; color: #6a4fbf; font-weight: bold; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* Dropdown */
        .dropdown-content { 
            display: none; position: absolute; right: 0; top: 50px; 
            background: white; min-width: 160px; border-radius: 15px; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.2); z-index: 100; 
        }
        .dropdown-content a { color: #6a4fbf; padding: 12px 16px; text-decoration: none; display: block; font-weight: bold; }
        .show { display: block; }
    </style>
</head>
<body>

<div class="header-wrapper">
    <div class="logo"><img src="logo.png"></div>
    <div class="title-area">
        <img src="title.png"><br>
        <span class="slogan">Mood your day, Bloom your mind.</span>
    </div>
    <div class="menu-btn" onclick="toggleMenu()">☰
        <div id="navDrop" class="dropdown-content">
            <a href="profile.html">Profile</a>
            <a href="feedback.html">Feedback</a>
            <a href="login.html" style="color:red;">Logout</a>
        </div>
    </div>
</div>

<div class="divider-line"></div>

<div class="article-main">
    <!-- Left Selection Grid -->
    <div class="article-list-container">
        <div class="article-card" onclick="loadArticle('Mindfulness 101', 'Learning to breathe is the first step to blooming...')">
            <div class="article-thumb">🌿</div>
            <h4>Mindfulness 101</h4>
        </div>
        <div class="article-card" onclick="loadArticle('Better Sleep', 'Your mood depends heavily on your rest...')">
            <div class="article-thumb">🌙</div>
            <h4>Better Sleep</h4>
        </div>
        <div class="article-card" onclick="loadArticle('Handling Stress', 'Stress is like a storm; you just need an umbrella...')">
            <div class="article-thumb">☁️</div>
            <h4>Handling Stress</h4>
        </div>
        <div class="article-card" onclick="loadArticle('Self-Love', 'Be kind to yourself, you are doing great...')">
            <div class="article-thumb">🌸</div>
            <h4>Self-Love</h4>
        </div>
    </div>

    <!-- Right Reading Pane -->
    <div class="reader-view">
        <h2 id="articleTitle">Select an Article</h2>
        <div class="reader-content" id="articleBody">
            Click on one of the cards on the left to start reading tips on how to bloom your mind.
        </div>
    </div>

    <!-- 4 Circle Utility -->
    <div class="circle-actions">
        <div class="action-btn" onclick="location.href='search.html'"><img src="icons/search.png"></div>
        <div class="action-btn" onclick="location.href='diaryhistory.html'"><img src="icons/book.png"></div>
        <div class="action-btn" onclick="location.href='dashboard.html'"><img src="icons/stats.png"></div>
        <div class="action-btn" onclick="location.href='gallery.html'"><img src="icons/camera.png"></div>
    </div>
</div>

<a href="mainpage.html" class="back-pill">Back</a>

<script>
    function loadArticle(title, content) {
        document.getElementById('articleTitle').innerText = title;
        document.getElementById('articleBody').innerText = content;
    }

    function toggleMenu() { document.getElementById("navDrop").classList.toggle("show"); }
    
    window.onclick = function(e) { 
        if (!e.target.matches('.menu-btn')) {
            const d = document.getElementById("navDrop");
            if (d.classList.contains('show')) d.classList.remove('show');
        }
    }
</script>

</body>
</html>
