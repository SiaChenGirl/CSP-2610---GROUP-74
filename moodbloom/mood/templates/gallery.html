<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Gallery</title>
    <style>
        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, #CBB7FF 0%, #E8E0FF 100%);
            min-height: 100vh; color: #4a3494;
        }

        /* Header (Same as above) */
        .header-wrapper { display: flex; justify-content: space-between; align-items: flex-start; padding: 30px 60px 10px 60px; }
        .logo img { width: 180px; }
        .title-area { text-align: center; margin-top: 10px; }
        .title-area img { width: 230px; }
        .divider-line { height: 2px; background-color: white; margin: 0 60px 30px 60px; opacity: 0.8; }

        /* Gallery Grid */
        .gallery-container { display: flex; justify-content: center; gap: 40px; padding: 0 60px; }
        .gallery-box { 
            background: white; border-radius: 40px; padding: 40px; 
            width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .photo-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        .photo-item { text-align: center; }
        .photo-placeholder { 
            width: 100%; aspect-ratio: 1; background: #f0ebff; 
            border-radius: 15px; margin-bottom: 8px; border: 1px dashed #b39ddb;
        }
        .photo-date { font-size: 12px; font-weight: bold; color: #6a4fbf; }

        /* Actions & Pill */
        .circle-actions { display: flex; flex-direction: column; gap: 20px; }
        .action-btn { width: 65px; height: 65px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); cursor: pointer; }
        .action-btn img { width: 28px; opacity: 0.7; }
        .active-circle { background: #b39ddb; } 
        .active-circle img { filter: brightness(0) invert(1); opacity: 1; }
        
        .back-pill { position: fixed; bottom: 30px; right: 50px; background: white; padding: 12px 45px; border-radius: 50px; text-decoration: none; color: #6a4fbf; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="header-wrapper">
        <div class="logo"><img src="logo.png"></div>
        <div class="title-area"><img src="title.png"><br><span style="color:white; font-style:italic;">Mood your day, Bloom your mind.</span></div>
        <div style="font-size:35px; color:white; cursor:pointer;">☰</div>
    </div>
    <div class="divider-line"></div>

    <div class="gallery-container">
        <div class="gallery-box">
            <div class="photo-grid" id="photoGrid">
                <!-- Example Items -->
                <div class="photo-item"><div class="photo-placeholder"></div><span class="photo-date">2026-04-01</span></div>
                <div class="photo-item"><div class="photo-placeholder"></div><span class="photo-date">2026-04-03</span></div>
                <div class="photo-item"><div class="photo-placeholder"></div><span class="photo-date">2026-04-05</span></div>
                <div class="photo-item"><div class="photo-placeholder"></div><span class="photo-date">2026-04-10</span></div>
                <!-- Add more here -->
            </div>
        </div>

        <div class="circle-actions">
            <div class="action-btn" onclick="location.href='search.html'"><img src="icons/search.png"></div>
            <div class="action-btn" onclick="location.href='diaryhistory.html'"><img src="icons/book.png"></div>
            <div class="action-btn" onclick="location.href='dashboard.html'"><img src="icons/stats.png"></div>
            <div class="action-btn active-circle"><img src="icons/camera.png"></div>
        </div>
    </div>

    <a href="mainpage.html" class="back-pill">Back</a>
</body>
</html>
