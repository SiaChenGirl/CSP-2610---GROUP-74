<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #fdfbfb 0%, #e8e0ff 100%); min-height: 100vh; display: flex; flex-direction: column; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .header-line { border: 0; height: 1px; background: #c5b3e6; margin: 0 40px 30px 40px; }
        .logo { width: 200px; }
        .logo img { width: 180px; } 
        .title { width: 220px; }
        .title img { width: 100%; }
        .menu { width: 150px; }
        .content { flex: 1; display: flex; justify-content: center; align-items: center; gap: 60px; padding: 20px; }
        .main-slogan { font-family: 'Dancing Script', cursive; font-size: 32px; color: #6a4fbf; margin-bottom: 20px; text-align: center; }
        .quote-box { width: 300px; height: 380px; background: white; border-radius: 25px; padding: 30px; display: flex; flex-direction: column; align-items: center; font-family: 'Dancing Script', cursive; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .quote-title { font-size: 28px; margin-bottom: 20px; color: #6a4fbf; border-bottom: 1px solid #e8e0ff; width: 100%; padding-bottom: 10px; }
        #quote-display { font-size: 20px; line-height: 1.8; color: #6a4fbf; white-space: pre-line; }
        .right-side { display: flex; flex-direction: column; align-items: center; }
        .box { width: 350px; background: white; padding: 40px; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; background: #b39ddb; border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main:hover { background: #9a81c7; }
        .links { margin-top: 15px; font-size: 13px; }
        a { color: #6a4fbf; text-decoration: none; }
    </style>
</head>
<body>
    <!-- 必须保留：Django 用于验证 POST 请求的安全 Token -->
    {% csrf_token %}

    <div class="header-wrapper">
        <div class="logo"><img src="/static/logo.png"></div>
        <div class="title"><img src="/static/title.png"></div>
        <div class="menu"></div>
    </div>
    <hr class="header-line">

    <div class="content">
        <div class="quote-box">
            <div class="quote-title">Daily Bloom</div>
            <p id="quote-display"></p>
        </div>

        <div class="right-side">
            <div class="main-slogan">Mood your mind, Bloom your day</div>
            <div class="box">
                <h2 style="color: #6a4fbf; margin-top:0;">Login</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button class="btn-main" onclick="handleLogin()">Log In</button>
                <div class="links">
                    <a href="/register/">Register</a> | <a href="/forgot/">Forgot Password?</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function handleLogin() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            // 获取页面中的 CSRF Token
            const tokenElement = document.querySelector('[name=csrfmiddlewaretoken]');
            const csrftoken = tokenElement ? tokenElement.value : '';

            // 关键改动：fetch 路径改为 '/'，因为你的 urls.py 里 path('', views.login_view) 是根路径
            fetch('/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrftoken 
                },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(res => res.json())
            .then(data => {
                if (data.message === 'Login successful') {
                    // 登录成功，跳转到主页路径
                    window.location.href = '/mainpage/';
                } else {
                    // 显示后端返回的具体错误（如：Invalid credentials）
                    alert(data.error || 'Login failed');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Connection error. Please try again later.');
            });
        }

        // 每日诗句逻辑
        const quotes = [
            `Today feels gentle 🌙\nlike a quiet sky above ☁️\neven the smallest light ✨\nstill finds a way to shine 🌸`,
            `You are growing slowly 🌱\neven when you cannot see 🍃\nevery step you’re taking\nis shaping who you’ll be 💜`,
            `Some days feel heavy 🌧️\nlike waves you cannot fight 🌊\nbut storms don’t last forever\nthey fade into the light 🌈`,
            `Breathe in softly 🌿\nlet your heart feel calm ☁️\nyou don’t need perfection\njust be who you are 💫`
        ];
        let i = 0;
        function showQuote() {
            const display = document.getElementById("quote-display");
            if(display) {
                display.innerText = quotes[i];
                i = (i + 1) % quotes.length;
            }
        }
        showQuote();
        setInterval(showQuote, 10000);
    </script>
</body>
</html>
