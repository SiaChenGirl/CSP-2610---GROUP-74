{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodBloom | Profile</title>
    <style>
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: linear-gradient(135deg, #fdfbfb 0%, #e8e0ff 100%); 
            min-height: 100vh; 
        }
        .header-wrapper { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 50px; 
        }
        .header-line { 
            border: 0; 
            height: 1px; 
            background: #c5b3e6; 
            margin: 0 40px 30px 40px; 
        }
        .logo img { width: 110px; } 
        .title-img img { width: 230px; }
        
        .container { 
            max-width: 600px; 
            margin: 30px auto; 
            background: white; 
            padding: 40px; 
            border-radius: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
        }
        
        .field { margin-bottom: 20px; }
        label { 
            display: block; 
            color: #6a4fbf; 
            font-weight: bold; 
            margin-bottom: 5px; 
            font-size: 14px; 
        }
        input { 
            width: 100%; 
            padding: 12px; 
            border-radius: 12px; 
            border: 1px solid #eee; 
            box-sizing: border-box; 
            background: #fafafa; 
            transition: 0.3s; 
        }
        input:focus { 
            border-color: #b39ddb; 
            outline: none; 
            background: white; 
        }
        
        /* 针对 type="date" 的微调，确保样式统一 */
        input[type="date"] {
            font-family: inherit;
            color: #4a3494;
        }
        
        .btn { 
            width: 100%; 
            padding: 14px; 
            background: #b39ddb; 
            border: none; 
            border-radius: 12px; 
            color: white; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            transition: 0.3s; 
            font-size: 16px;
        }
        .btn:hover { background: #9a81c7; }
        
        .btn-del { 
            background: none; 
            border: 1px solid #ffb3b3; 
            color: #ff6666; 
            margin-top: 15px; 
        }
        
        .back-btn {
            background: none; 
            border: none; 
            color: #6a4fbf; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 16px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="header-wrapper">
        <div class="logo">
            <img src="{% static 'logo.png' %}" alt="Logo">
        </div>
        <div class="title-img">
            <img src="{% static 'title.png' %}" alt="Title">
        </div>
        <div class="menu">
            <a href="{% url 'mainpage' %}" class="back-btn">Back</a>
        </div>
    </div>
    <hr class="header-line">

    <div class="container">
        <div style="width:120px; height:120px; background:#f0f0f0; border-radius:50%; margin: 0 auto 20px; border: 2px solid #e8e0ff; display: flex; align-items:center; justify-content:center; font-size:40px;">👤</div>
        
        <form method="POST" action="{% url 'profile' %}">
            {% csrf_token %}
            
            <div class="field">
                <label>Username</label>
                <input type="text" name="username" value="{{ user.username }}" required>
            </div>
            
            <div class="field">
                <label>Birthday</label>
                <!-- 关键修改：type="date" 并使用 |date:'Y-m-d' 过滤器格式化数据 -->
                <input type="date" name="birthday" value="{{ profile.birthday|date:'Y-m-d' }}">
            </div>
            
            <div class="field">
                <label>Gender</label>
                <input type="text" name="gender" value="{{ profile.gender|default:'' }}" placeholder="e.g. Female">
            </div>
            
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>

            <div class="field">
                <label>Password</label>
                <input type="password" value="********" disabled title="Password cannot be changed here">
            </div>

            <button type="submit" class="btn">Save Changes</button>
        </form>

        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-del" onclick="return confirm('Are you sure you want to logout?')">Logout</button>
        </form>
    </div>

    {% if messages %}
        {% for message in messages %}
            <script>alert("{{ message }}");</script>
        {% endfor %}
    {% endif %}
</body>
</html>
