{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MoodBloom | Feedback</title>
    <style>
        body { margin: 0; font-family: Arial; background: linear-gradient(135deg, #fdfbfb 0%, #e8e0ff 100%); min-height: 100vh; }
        .header-wrapper { display: flex; justify-content: space-between; align-items: center; padding: 20px 50px; }
        .header-line { border: 0; height: 1px; background: #c5b3e6; margin: 0 40px 30px 40px; }
        .logo img { width: 110px; } .title-img img { width: 230px; }
        .container { max-width: 500px; margin: 50px auto; background: white; padding: 40px; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .star { font-size: 35px; color: #ddd; cursor: pointer; transition: 0.2s; }
        .star.active { color: #ffcc00; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; background: #fafafa; }
        .btn { width: 100%; padding: 14px; background: #b39ddb; border: none; border-radius: 12px; color: white; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header-wrapper">
        <!-- 使用 static 标签确保图片正常显示 -->
        <div class="logo"><img src="{% static 'logo.png' %}"></div>
        <div class="title-img"><img src="{% static 'title.png' %}"></div>
        <div class="menu">
    <a href="{% url 'mainpage' %}" style="text-decoration:none; color:#6a4fbf; font-weight:bold; cursor:pointer;">Back</a>
</div>
    </div>
    <hr class="header-line">
    <div class="container">
        <h2 style="color:#6a4fbf;">Feedback</h2>
        <div id="stars">
            <span class="star" onclick="rate(1)">★</span><span class="star" onclick="rate(2)">★</span><span class="star" onclick="rate(3)">★</span><span class="star" onclick="rate(4)">★</span><span class="star" onclick="rate(5)">★</span>
        </div>
        <!-- 保持原样，仅添加 id 供 JS 获取数据 -->
        <input type="email" id="email_input" placeholder="Your Email" value="{{ request.user.email }}">
        <textarea id="content_input" placeholder="How can we improve?" rows="4"></textarea>
        <!-- 修改 onclick 函数名 -->
        <button class="btn" onclick="submitFeedback()">Submit</button>
    </div>

    <script>
        let selectedRating = 0; // 记录评分

        function rate(n) {
            selectedRating = n;
            const s = document.querySelectorAll('.star');
            s.forEach((star, i) => star.classList.toggle('active', i < n));
        }

        function submitFeedback() {
            const email = document.getElementById('email_input').value;
            const content = document.getElementById('content_input').value;

            // 简单的验证
            if (selectedRating === 0 || !content) {
                alert("Please provide a rating and your feedback! 🌸");
                return;
            }

            // 使用 fetch 发送到后端
            fetch("{% url 'feedback' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    rating: selectedRating,
                    email: email,
                    content: content,
                    subject: "General Feedback" // 默认主题
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert('Thanks!'); 
                    location.href = "{% url 'mainpage' %}";
                } else {
                    alert('Error: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred. Please try again.');
            });
        }
    </script>
</body>
</html>
